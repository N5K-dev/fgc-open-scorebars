    const wasBooting = stage.classList.contains('is-booting');
    if (wasBooting) {
      void stage.offsetWidth;
      stage.classList.remove('is-booting');
      lastIntroNonce = res.introNonce || 0;
    } else if (res.introNonce && res.introNonce !== lastIntroNonce) {
      lastIntroNonce = res.introNonce;
      triggerEntryAnim(effEntry);
    }
  }

  /* =========================================================================
     PURE HTML5 CANVAS 1920x1080 PNG SOCIAL GRAPHIC EXPORTER
     ========================================================================= */
  async function loadImg(src) {
    if (!src) return null;
    return new Promise(resolve => {
      const im = new Image();
      im.crossOrigin = 'anonymous';
      im.onload = () => resolve(im);
      im.onerror = () => resolve(null);
      im.src = src;
    });
  }
  async function loadSvgAsImg(svg) {
    if (!svg) return null;
    const imgMatch = String(svg).match(/<img[^>]+src="([^"]+)"/i);
    if (imgMatch && imgMatch[1]) return loadImg(imgMatch[1]);
    const blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const im = await loadImg(url);
    URL.revokeObjectURL(url);
    return im;
  }

  async function exportResultsPng() {
    if (!currentState) return;
    const st = currentState;
    const res = st.results || {};
    const d = DESIGN_MAP[res.design] || FALLBACK_DESIGN;
    const effLayout = (res.layoutOverride && res.layoutOverride !== 'theme') ? res.layoutOverride : (d.layout || 'champ-left');
    const pickHex = (str, fb) => (String(str || '').match(/#[0-9a-fA-F]{6}/) || [fb])[0];

    const isVertical = (res.aspect === '4:5' && (res.viewMode || 'normal') === 'normal');
    const W = isVertical ? 1080 : 1920;
    const H = isVertical ? 1350 : 1080;
    const padX = isVertical ? 40 : 56;
    const innerW = W - padX * 2;

    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');

    if (res.bgMode !== 'transparent') {
      const c1 = res.bgMode === 'custom' ? (res.bgColor1 || '#1d356b') : pickHex(d.bg, '#1d356b');
      const c2 = res.bgMode === 'custom' ? (res.bgColor2 || '#060912') : (d.lightBg ? '#e2e8f0' : '#060912');
      const gr = ctx.createRadialGradient(W * 0.25, H * 0.28, 80, W * 0.5, H * 0.5, Math.max(W, H) * 0.72);
      gr.addColorStop(0, c1); gr.addColorStop(1, c2);
      ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
    }

    const accent = (res.accentColor && res.accentColor.trim()) ? res.accentColor : d.accent;
    const gold = (res.goldColor && res.goldColor.trim()) ? res.goldColor : d.gold;

    const isLightCard = Boolean(d.lightCard);
    // Header
    ctx.fillStyle = isLightCard ? 'rgba(255,255,255,0.96)' : 'rgba(10,14,26,0.92)';
    ctx.beginPath(); ctx.roundRect(padX, 34, innerW, 108, 10); ctx.fill();
    ctx.fillStyle = accent; ctx.fillRect(padX, 34, 8, 108);

    const rawLogo = res.logoUrl || st.vs?.logoUrl || '';
    const logoIm = res.showLogo !== false && rawLogo ? await loadImg(resolveMediaSrc(rawLogo)) : null;
    let titleX = padX + 30;
    if (logoIm) {
      const sc = Math.min(140 / logoIm.naturalWidth, 74 / logoIm.naturalHeight, 1);
      const lw = logoIm.naturalWidth * sc, lh = logoIm.naturalHeight * sc;
      ctx.drawImage(logoIm, padX + 24, 88 - lh / 2, lw, lh);
      titleX = padX + 44 + lw;
    }
    ctx.fillStyle = accent;
    const effFont = (res.fontDisplay && res.fontDisplay !== 'theme') ? res.fontDisplay : (d.font || 'Russo One');
    const cFont = window.FGC_CUSTOM_FONTS?.resolveCanvasFamily(effFont, '"Russo One", "Barlow Condensed", sans-serif') || '"Russo One", "Barlow Condensed", sans-serif';
    if (document.fonts?.ready) { try { await document.fonts.ready; } catch {} }
    ctx.font = '800 22px "Barlow Condensed", sans-serif';
    ctx.fillText(String(res.subtitle || 'TOURNAMENT FINALS').toUpperCase(), titleX, 72);
    ctx.fillStyle = d.text || '#ffffff';
    ctx.font = `900 ${isVertical ? 38 : 50}px ${cFont}`;
    ctx.fillText(String(res.title || st.tournament || 'TOP 8 RESULTS').toUpperCase(), titleX, 122);

    const showTop12 = Boolean(res.showTop12) && effLayout !== 'podium-3' && effLayout !== 'top4-quad';
    const maxCount = effLayout === 'podium-3' ? 3 : effLayout === 'top4-quad' ? 4 : (showTop12 ? 12 : 8);
    const placements = (res.placements || []).slice(0, maxCount);
    const charImgs = await Promise.all(placements.map(pl => loadImg(buildCharRenderUrl(res.game, res.pack, pl.character))));
    const avImgs = await Promise.all(placements.map(pl => loadImg(resolveMediaSrc(pl.avatar))));

    // Compute clean card rects matching active layout & aspect ratio
    const rects = [];
    const topY = 164, gap = isVertical ? 14 : 18;
    const top12H = showTop12 ? (isVertical ? 144 : 118) : 0;
    const totalH = (H - topY - 46) - (showTop12 ? (top12H + gap) : 0);
    if (isVertical) {
      const h1 = Math.round(totalH * 0.36);
      const h2 = Math.round(totalH * 0.32);
      const h3 = totalH - h1 - h2 - gap * 2;
      rects[0] = { x: padX, y: topY, w: innerW, h: h1 };
      const wMid = (innerW - gap * 2) / 3;
      for (let i = 1; i <= 3; i++) rects[i] = { x: padX + (i - 1) * (wMid + gap), y: topY + h1 + gap, w: wMid, h: h2 };
      const wBot = (innerW - gap * 3) / 4;
      for (let i = 4; i < 8; i++) rects[i] = { x: padX + (i - 4) * (wBot + gap), y: topY + h1 + h2 + gap * 2, w: wBot, h: h3 };
    } else if (effLayout === 'podium-3') {
      const w = 540;
      rects[0] = { x: 690, y: topY, w: 540, h: totalH };
      rects[1] = { x: 116, y: topY + 64, w, h: totalH - 64 };
      rects[2] = { x: 1264, y: topY + 98, w, h: totalH - 98 };
    } else if (effLayout === 'top4-quad') {
      const w = (innerW - gap * 3) / 4;
      for (let i = 0; i < 4; i++) rects[i] = { x: padX + i * (w + gap), y: topY, w, h: totalH };
    } else if (effLayout === 'esports-grid') {
      const w = (innerW - gap * 3) / 4, h = (totalH - gap) / 2;
      for (let i = 0; i < 8; i++) rects[i] = { x: padX + (i % 4) * (w + gap), y: topY + Math.floor(i / 4) * (h + gap), w, h };
    } else if (effLayout === 'podium-top') {
      const h1 = Math.round(totalH * 0.56), h2 = totalH - h1 - gap;
      const w1 = (innerW - gap * 2) / 3;
      rects[1] = { x: padX, y: topY + 32, w: w1, h: h1 - 32 };
      rects[0] = { x: padX + w1 + gap, y: topY, w: w1, h: h1 };
      rects[2] = { x: padX + (w1 + gap) * 2, y: topY + 44, w: w1, h: h1 - 44 };
      const w2 = (innerW - gap * 4) / 5;
      for (let i = 3; i < 8; i++) rects[i] = { x: padX + (i - 3) * (w2 + gap), y: topY + h1 + gap, w: w2, h: h2 };
    } else {
      const leftW = 620, rightX = padX + leftW + gap, rightW = innerW - leftW - gap;
      const h1 = Math.round(totalH * 0.52), h2 = totalH - h1 - gap;
      rects[0] = { x: padX, y: topY, w: leftW, h: totalH };
      const wTop = (rightW - gap * 2) / 3;
      for (let i = 1; i <= 3; i++) rects[i] = { x: rightX + (i - 1) * (wTop + gap), y: topY, w: wTop, h: h1 };
      const wBot = (rightW - gap * 3) / 4;
      for (let i = 4; i < 8; i++) rects[i] = { x: rightX + (i - 4) * (wBot + gap), y: topY + h1 + gap, w: wBot, h: h2 };
    }
    if (showTop12) {
      const y12 = topY + totalH + gap;
      const w12 = (innerW - gap * 3) / 4;
      for (let i = 8; i < 12; i++) rects[i] = { x: padX + (i - 8) * (w12 + gap), y: y12, w: w12, h: top12H };
    }

    for (let i = 0; i < placements.length; i++) {
      const r = rects[i]; if (!r) continue;
      const pl = placements[i];
      const rank = Number(pl.place || (i + 1));
      ctx.save();
      ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 12); ctx.clip();
      ctx.fillStyle = isLightCard ? '#f1f5f9' : 'rgba(13,19,36,0.94)';
      ctx.fillRect(r.x, r.y, r.w, r.h);

      const cim = charImgs[i];
      const gZoom = Number(res.charZoom ?? 100) / 100;
      const gX = Number(res.charOffsetX ?? 0);
      const gY = Number(res.charOffsetY ?? 0);
      const gFlip = res.charFlip ? -1 : 1;
      const pZoom = Number(pl.charZoom ?? 100) / 100;
      const pX = Number(pl.charX ?? 0);
      const pY = Number(pl.charY ?? 0);
      const pFlip = pl.charFlip ? -1 : 1;
      const totFlip = gFlip * pFlip;
      if (cim && res.avatarMode !== 'avatar-only') {
        const totZoom = gZoom * pZoom;
        const baseScale = Math.min(r.w / cim.naturalWidth, (r.h * 1.08) / cim.naturalHeight);
        const bw = cim.naturalWidth * baseScale;
        const bh = cim.naturalHeight * baseScale;
        const baseTop = (r.h * 1.08 - bh) * 0.22 - (r.h * 0.04);
        ctx.save();
        ctx.translate(r.x + r.w / 2 + gX + pX, r.y + r.h / 2 + gY + pY);
        ctx.scale(totZoom * totFlip, totZoom);
        ctx.drawImage(cim, -bw / 2, baseTop - r.h / 2, bw, bh);
        ctx.restore();
      } else if (avImgs[i]) {
        const aim = avImgs[i];
        const sz = Math.min(r.w, r.h) * 0.45;
        ctx.save();
        ctx.beginPath(); ctx.arc(r.x + r.w / 2, r.y + r.h * 0.4, sz / 2, 0, Math.PI * 2); ctx.clip();
        ctx.translate(r.x + r.w / 2 + gX + pX, r.y + r.h * 0.4 + gY + pY);
        ctx.scale(totFlip * gZoom * pZoom, gZoom * pZoom);
        ctx.drawImage(aim, -sz / 2, -sz / 2, sz, sz);
        ctx.restore();
      }

      if (isLightCard) {
        const barH = i === 0 ? 124 : 104;
        ctx.fillStyle = 'rgba(255,255,255,0.95)';
        ctx.fillRect(r.x, r.y + r.h - barH, r.w, barH);
        ctx.fillStyle = i === 0 ? gold : 'rgba(15,23,42,0.14)';
        ctx.fillRect(r.x, r.y + r.h - barH, r.w, i === 0 ? 3 : 2);
      } else {
        const sc = ctx.createLinearGradient(0, r.y + r.h * 0.56, 0, r.y + r.h);
        sc.addColorStop(0, 'rgba(5,7,14,0)');
        sc.addColorStop(0.65, 'rgba(5,7,14,0.82)');
        sc.addColorStop(1, 'rgba(5,7,14,0.96)');
        ctx.fillStyle = sc; ctx.fillRect(r.x, r.y, r.w, r.h);
      }

      // Rank pill
      ctx.fillStyle = rank === 1 ? gold : rank === 2 ? d.silver : rank === 3 ? d.bronze : 'rgba(8,10,18,0.88)';
      ctx.beginPath(); ctx.roundRect(r.x + 12, r.y + 12, rank === 1 ? 104 : 78, rank === 1 ? 44 : 36, 6); ctx.fill();
      ctx.fillStyle = (rank === 1 || rank === 2) ? '#090a0e' : '#ffffff';
      ctx.font = `900 ${rank === 1 ? 26 : 22}px "Russo One", sans-serif`;
      ctx.fillText(ordinal(rank), r.x + 24, r.y + (rank === 1 ? 43 : 38));

      // Flags + Sponsor + Name
      const flagItems = resolveFlags(pl, res);
      let fx = r.x + 16;
      for (const fi of flagItems) {
        const fim = await loadSvgAsImg(fi.svg);
        if (fim) { ctx.drawImage(fim, fx, r.y + r.h - 94, 28, 19); fx += 34; }
      }
      if (res.showSponsor !== false && pl.sponsor) {
        ctx.fillStyle = accent;
        ctx.font = '800 20px "Barlow Condensed", sans-serif';
        ctx.fillText(String(pl.sponsor).toUpperCase(), fx, r.y + r.h - 77);
      }
      ctx.fillStyle = d.text || '#ffffff';
      ctx.font = `900 ${i === 0 ? 44 : 28}px ${cFont}`;
      ctx.fillText(String(pl.name || `PLAYER ${i + 1}`).slice(0, 18), r.x + 16, r.y + r.h - 42);
      if (res.showCharName !== false && pl.character) {
        ctx.fillStyle = d.muted || '#94a3b8';
        ctx.font = '800 17px "Barlow Condensed", sans-serif';
        ctx.fillText(String(pl.character).toUpperCase(), r.x + 16, r.y + r.h - 16);
      }
      ctx.restore();
      ctx.strokeStyle = rank === 1 ? gold : rank === 2 ? d.silver : rank === 3 ? d.bronze : accent;
      ctx.lineWidth = rank === 1 ? 4 : 2;
      ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 12); ctx.stroke();
    }

    const a = document.createElement('a');
    const safeSlug = String(res.title || 'top8-results').toLowerCase().replace(/[^a-z0-9-]+/g, '-');
    a.download = `${safeSlug}.png`;
    a.href = canvas.toDataURL('image/png');
    a.click();
  }

  /* =========================================================================
     INTERACTIVE DIRECT IMAGE FRAMING (DRAG TO MOVE + WHEEL TO ZOOM IN PREVIEW)
     ========================================================================= */
  if (isPreview) {
    $('top8-bracket-view')?.addEventListener('click', (e) => {
      const box = e.target.closest('[data-bk-slot]');
      if (!box) return;
      selectedBracketSlot = box.dataset.bkSlot;
      document.querySelectorAll('[data-bk-slot]').forEach(el => el.classList.toggle('is-selected', el.dataset.bkSlot === selectedBracketSlot));
      window.parent?.postMessage({ type: 'top8-select-slot', slotId: selectedBracketSlot }, '*');
    });
    $('top8-matchup-view')?.addEventListener('click', (e) => {
      const box = e.target.closest('[data-bk-slot]');
      if (!box) return;
      window.parent?.postMessage({ type: 'top8-select-slot', slotId: box.dataset.bkSlot }, '*');
    });
    let dragCtx = null;
    const setSelectedCard = (idx) => {
      selectedIdx = idx;
      $('res-body').querySelectorAll('[data-idx]').forEach(el => {
        el.classList.toggle('res-selected', Number(el.dataset.idx) === idx);
      });
    };

    $('res-body').addEventListener('pointerdown', (e) => {
      const card = e.target.closest('[data-idx]');
      if (!card) return;
      const idx = Number(card.dataset.idx);
      const pl = (currentState?.results?.placements || [])[idx] || {};
      setSelectedCard(idx);
      window.parent?.postMessage({ type: 'res-select-player', idx }, '*');
      dragCtx = {
        idx,
        startClientX: e.clientX,
        startClientY: e.clientY,
        origX: Number(pl.charX ?? 0),
        origY: Number(pl.charY ?? 0),
        curX: Number(pl.charX ?? 0),
        curY: Number(pl.charY ?? 0),
        moved: false
      };
      document.body.classList.add('is-dragging');
      try { card.setPointerCapture(e.pointerId); } catch {}
      e.preventDefault();
    });

    window.addEventListener('pointermove', (e) => {
      if (!dragCtx) return;
      const sc = currentScale || 1;
      const dx = Math.round((e.clientX - dragCtx.startClientX) / sc);
      const dy = Math.round((e.clientY - dragCtx.startClientY) / sc);
      if (Math.abs(dx) > 2 || Math.abs(dy) > 2) dragCtx.moved = true;
      dragCtx.curX = Math.max(-400, Math.min(400, dragCtx.origX + dx));
      dragCtx.curY = Math.max(-400, Math.min(400, dragCtx.origY + dy));
      $('res-body').querySelectorAll(`[data-idx="${dragCtx.idx}"]`).forEach(el => {
        el.style.setProperty('--p-x', `${dragCtx.curX}px`);
        el.style.setProperty('--p-y', `${dragCtx.curY}px`);
      });
      window.parent?.postMessage({
        type: 'res-frame-patch',
        idx: dragCtx.idx,
        patch: { charX: dragCtx.curX, charY: dragCtx.curY },
        commit: false
      }, '*');
    });

    const endDrag = () => {
      if (!dragCtx) return;
      const ctx = dragCtx;
      dragCtx = null;
      document.body.classList.remove('is-dragging');
      if (ctx.moved) {
        window.parent?.postMessage({
          type: 'res-frame-patch',
          idx: ctx.idx,
          patch: { charX: ctx.curX, charY: ctx.curY },
          commit: true
        }, '*');
      }
    };
    window.addEventListener('pointerup', endDrag);
    window.addEventListener('pointercancel', endDrag);

    $('res-body').addEventListener('wheel', (e) => {
      const card = e.target.closest('[data-idx]');
      if (!card) return;
      e.preventDefault();
      const idx = Number(card.dataset.idx);
      const pl = (currentState?.results?.placements || [])[idx] || {};
      const curZoom = Number(pl.charZoom ?? 100);
      const delta = e.deltaY < 0 ? 6 : -6;
      const nextZoom = Math.max(40, Math.min(360, curZoom + delta));
      setSelectedCard(idx);
      $('res-body').querySelectorAll(`[data-idx="${idx}"]`).forEach(el => {
        el.style.setProperty('--p-zoom', (nextZoom / 100).toFixed(2));
      });
      window.parent?.postMessage({
        type: 'res-frame-patch',
        idx,
        patch: { charZoom: nextZoom },
        commit: true
      }, '*');
    }, { passive: false });
  }

  /* =========================================================================
     SYNC ENGINE: Zero-SSE Preview + Web Locks Single-SSE Leader + OBS Hooks
     ========================================================================= */
  window.addEventListener('message', (ev) => {
    const d = ev.data;
    if (!d) return;
    if (d.type === 'state-update' && d.state) { currentState = d.state; rescalePreview(); render(d.state); }
    else if (d.type === 'top8-highlight-slot') {
      selectedBracketSlot = String(d.slotId || '');
      document.querySelectorAll('[data-bk-slot]').forEach(el => {
        el.classList.toggle('is-selected', el.dataset.bkSlot === selectedBracketSlot);
      });
    }
    else if (d.type === 'fonts-update' && Array.isArray(d.fonts)) {
      window.FGC_CUSTOM_FONTS?.setFonts(d.fonts);
      if (currentState) render(currentState);
    }
    else if (d.type === 'res-highlight-player') {
      selectedIdx = Number(d.idx ?? -1);
      $('res-body').querySelectorAll('[data-idx]').forEach(el => {
        el.classList.toggle('res-selected', Number(el.dataset.idx) === selectedIdx);
      });
    } else if (d.type === 'test-results-entry') {
      const res = currentState?.results || {};
      const des = DESIGN_MAP[res.design] || FALLBACK_DESIGN;
      triggerEntryAnim((res.entryAnim && res.entryAnim !== 'theme') ? res.entryAnim : des.entry);
    } else if (d.type === 'export-results-png') {
      exportResultsPng();
    }
  });

  const onSceneShow = () => {
    if (currentState?.results?.visible !== false) {
      const res = currentState?.results || {};
      const des = DESIGN_MAP[res.design] || FALLBACK_DESIGN;
      triggerEntryAnim((res.entryAnim && res.entryAnim !== 'theme') ? res.entryAnim : des.entry);
    }
  };
  window.addEventListener('obsSourceActiveChanged', (e) => { if (e?.detail?.active) onSceneShow(); });
  window.addEventListener('obsSourceVisibleChanged', (e) => { if (e?.detail?.visible) onSceneShow(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) onSceneShow(); });

  window.FGC_AUDIO?.init({ role: 'results', isPreview: isPreview || isExport });

  let bc = null;
  try {
    bc = new BroadcastChannel('fgc_open_scorebar');
    bc.onmessage = (ev) => {
      if (ev.data?.type === 'state' && ev.data.payload) render(ev.data.payload);
      else if (ev.data?.type === 'fonts' && Array.isArray(ev.data.payload)) {
        window.FGC_CUSTOM_FONTS?.setFonts(ev.data.payload);
        if (currentState) render(currentState);
      } else if (ev.data?.type === 'sfx' && Array.isArray(ev.data.payload)) {
        window.FGC_AUDIO?.setCustomSfx(ev.data.payload);
      } else if (ev.data?.type === 'audio' && ev.data.payload) {
        window.FGC_AUDIO?.handleAudioEvent(ev.data.payload);
      }
    };
  } catch {}

  if (isHttp) {
    window.FGC_CUSTOM_FONTS?.fetchAndSync().then(() => { if (currentState) render(currentState); });
    fetch('/api/state', { cache: 'no-store' }).then(r => r.json()).then(st => {
      render(st);
      if (!isPreview && !isExport && st?.results?.visible !== false) onSceneShow();
    }).catch(() => {
      $('res-stage')?.classList.remove('is-booting');
    });

    if (!isPreview && !isExport) {
      let activeEs = null, reconnectTimer = null, pageUnloading = false;
      const closeSSE = () => {
        pageUnloading = true;
        clearTimeout(reconnectTimer);
        if (activeEs) { try { activeEs.close(); } catch {} activeEs = null; }
      };
      window.addEventListener('pagehide', closeSSE);
      window.addEventListener('beforeunload', closeSSE);

      const connectSSE = () => {
        if (pageUnloading) return;
        if (activeEs) { try { activeEs.close(); } catch {} }
        const es = new EventSource('/api/events?client=results' + (window.obsstudio ? '&obs=1' : ''));
        activeEs = es;
        es.addEventListener('state', (ev) => {
          try {
            const data = JSON.parse(ev.data);
            render(data);
            if (bc) bc.postMessage({ type: 'state', payload: data, fromSse: true });
          } catch {}
        });
        es.addEventListener('fonts', (ev) => {
          try {
            const list = JSON.parse(ev.data);
            window.FGC_CUSTOM_FONTS?.setFonts(list);
            if (currentState) render(currentState);
            if (bc) bc.postMessage({ type: 'fonts', payload: list, fromSse: true });
          } catch {}
        });
        es.addEventListener('sfx', (ev) => {
          try {
            const list = JSON.parse(ev.data);
            window.FGC_AUDIO?.setCustomSfx(list);
            if (bc) bc.postMessage({ type: 'sfx', payload: list, fromSse: true });
          } catch {}
        });
        es.addEventListener('audio', (ev) => {
          try {
            const payload = JSON.parse(ev.data);
            window.FGC_AUDIO?.handleAudioEvent(payload);
            if (bc) bc.postMessage({ type: 'audio', payload, fromSse: true });
          } catch {}
        });
        es.onerror = () => {
          if (activeEs === es) activeEs = null;
          try { es.close(); } catch {}
          clearTimeout(reconnectTimer);
          if (!pageUnloading) reconnectTimer = setTimeout(connectSSE, 1500);
        };
      };

      const isObs = Boolean(window.obsstudio);
      if (!isObs && navigator.locks && typeof navigator.locks.request === 'function' && bc) {
        navigator.locks.request('fgc_open_scorebar_sse_leader', () => new Promise((resolve) => {
          if (pageUnloading) return resolve();
          connectSSE();
          window.addEventListener('pagehide', resolve, { once: true });
          window.addEventListener('beforeunload', resolve, { once: true });
        })).catch(() => connectSSE());
      } else {
        connectSSE();
      }
    }
  } else {
    try {
      const cached = localStorage.getItem('fgc_open_scorebar_state_v1');
      if (cached) render(JSON.parse(cached));
      else $('res-stage')?.classList.remove('is-booting');
    } catch { $('res-stage')?.classList.remove('is-booting'); }
  }
})();
</script>
</body>
</html>
