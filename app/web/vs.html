  #vs-stage[data-plate-meta-order="sponsor-flags-bracket"] .vs-plate.right .vs-flags   { order: 2; }
  #vs-stage[data-plate-meta-order="sponsor-flags-bracket"] .vs-plate.right .vs-bracket { order: 1; }

  #vs-stage[data-plate-meta-order="bracket-sponsor-flags"] .vs-bracket { order: 1; }
  #vs-stage[data-plate-meta-order="bracket-sponsor-flags"] .vs-sponsor { order: 2; }
  #vs-stage[data-plate-meta-order="bracket-sponsor-flags"] .vs-flags   { order: 3; }
  #vs-stage[data-plate-meta-order="bracket-sponsor-flags"] .vs-plate.right .vs-bracket { order: 3; }
  #vs-stage[data-plate-meta-order="bracket-sponsor-flags"] .vs-plate.right .vs-sponsor { order: 2; }
  #vs-stage[data-plate-meta-order="bracket-sponsor-flags"] .vs-plate.right .vs-flags   { order: 1; }

  #vs-stage[data-plate-meta-order="flags-bracket-sponsor"] .vs-flags   { order: 1; }
  #vs-stage[data-plate-meta-order="flags-bracket-sponsor"] .vs-bracket { order: 2; }
  #vs-stage[data-plate-meta-order="flags-bracket-sponsor"] .vs-sponsor { order: 3; }
  #vs-stage[data-plate-meta-order="flags-bracket-sponsor"] .vs-plate.right .vs-flags   { order: 3; }
  #vs-stage[data-plate-meta-order="flags-bracket-sponsor"] .vs-plate.right .vs-bracket { order: 2; }
  #vs-stage[data-plate-meta-order="flags-bracket-sponsor"] .vs-plate.right .vs-sponsor { order: 1; }

  #vs-stage[data-plate="arcade-box"] .vs-plate {
    border-radius: 6px;
    border-top: 4px solid rgba(255,255,255,0.88);
    box-shadow: 0 14px 0 rgba(0,0,0,0.28), 0 24px 48px rgba(0,0,0,0.65);
  }
  #vs-stage[data-plate="t8-blade"] .vs-plate {
    clip-path: polygon(24px 0, 100% 0, calc(100% - 24px) 100%, 0 100%);
    padding: 16px 42px;
    border: none;
    border-top: 2px solid rgba(255,255,255,0.3);
    border-bottom: 5px solid var(--vs-p1);
  }
  #vs-stage[data-plate="t8-blade"] .vs-plate.right {
    clip-path: polygon(0 0, calc(100% - 24px) 0, 100% 100%, 24px 100%);
    border-bottom-color: var(--vs-p2);
  }
  #vs-stage[data-plate="glass-pill"] .vs-plate {
    border-radius: 20px;
    backdrop-filter: blur(20px) saturate(145%);
    -webkit-backdrop-filter: blur(20px) saturate(145%);
    border: 1.5px solid rgba(255,255,255,0.24);
  }
  #vs-stage[data-plate="glass-pill"] .vs-plate.left { border-left: 7px solid var(--vs-p1); }
  #vs-stage[data-plate="glass-pill"] .vs-plate.right { border-right: 7px solid var(--vs-p2); }
  #vs-stage[data-plate="glass-pill"] .vs-avatar-badge { border-radius: 50%; }

  #vs-stage[data-plate="floating-clean"] .vs-plate {
    border: none;
    border-bottom: 4px solid var(--vs-p1);
    border-radius: 4px;
    box-shadow: 0 14px 36px rgba(0,0,0,0.45);
  }
  #vs-stage[data-plate="floating-clean"] .vs-plate.right { border-bottom-color: var(--vs-p2); }

  #vs-stage[data-plate="corner-ribbon"] .vs-plate.left  { left: 0; border-left: none; border-right: 8px solid var(--vs-p1); border-radius: 0 12px 12px 0; padding-left: 48px; }
  #vs-stage[data-plate="corner-ribbon"] .vs-plate.right { right: 0; border-right: none; border-left: 8px solid var(--vs-p2); border-radius: 12px 0 0 12px; padding-right: 48px; }

  #vs-stage[data-plate="hex-plate"] .vs-plate {
    clip-path: polygon(28px 0, calc(100% - 28px) 0, 100% 50%, calc(100% - 28px) 100%, 28px 100%, 0 50%);
    padding: 16px 46px;
    border: none;
    border-top: 2px solid var(--vs-p1);
    border-bottom: 4px solid var(--vs-p1);
  }
  #vs-stage[data-plate="hex-plate"] .vs-plate.right { border-top-color: var(--vs-p2); border-bottom-color: var(--vs-p2); }

  #vs-stage[data-plate="comic-skew"] .vs-plate {
    border: 3.5px solid var(--vs-accent);
    box-shadow: 10px 10px 0 rgba(0,0,0,0.85);
    transform: scale(var(--plate-scale, 1)) skewX(var(--plate-skew, -7deg));
  }
  #vs-stage[data-plate="comic-skew"] .vs-plate > :not(.vs-plate-flag-bg) { transform: skewX(calc(var(--plate-skew, -7deg) * -1)); }

  #vs-stage[data-plate="stacked-banner"] .vs-plate {
    border-radius: 12px;
    border-top: 4px solid var(--vs-p1);
    border-left-width: 2px;
    border-right-width: 2px;
  }
  #vs-stage[data-plate="stacked-banner"] .vs-plate.right { border-top-color: var(--vs-p2); }

  #vs-stage[data-plate="luxury-thin"] .vs-plate {
    border: 1px solid rgba(255,255,255,0.22);
    border-bottom: 2px solid var(--vs-p1);
    border-left-width: 1px;
    border-right-width: 1px;
    backdrop-filter: blur(12px);
  }
  #vs-stage[data-plate="luxury-thin"] .vs-plate.right { border-bottom-color: var(--vs-p2); }

  /* Painterly Brush-Stroke Top Plates (Ref: VS Splash Referencia 1.png) */
  #vs-stage[data-plate="brush-top"] .vs-plate {
    bottom: auto;
    top: 46px;
    min-height: 92px;
    border: none;
    border-radius: 0;
    box-shadow: 0 14px 32px rgba(0, 0, 0, 0.72);
  }
  #vs-stage[data-plate="brush-top"] .vs-plate.left {
    left: 0;
    padding: 12px 58px 12px 44px;
    background: linear-gradient(90deg, var(--vs-p1) 0%, color-mix(in srgb, var(--vs-p1) 75%, #000) 76%, transparent 100%);
    clip-path: polygon(0 4%, 94% 0, 100% 24%, 92% 48%, 98% 78%, 88% 100%, 0 96%);
  }
  #vs-stage[data-plate="brush-top"] .vs-plate.right {
    right: 0;
    padding: 12px 44px 12px 58px;
    background: linear-gradient(270deg, var(--vs-p2) 0%, color-mix(in srgb, var(--vs-p2) 75%, #000) 76%, transparent 100%);
    clip-path: polygon(6% 0, 100% 4%, 100% 96%, 12% 100%, 2% 76%, 8% 46%, 0 22%);
  }
  #vs-stage[data-plate="brush-top"] .vs-player-name {
    text-shadow: 0 2px 0 rgba(255, 255, 255, 0.25), 0 4px 12px rgba(0, 0, 0, 0.35);
  }

  /* Convergent Diagonal Slash Plates (Ref: VS Splash Referencia 2.png — UNI II) */
  #vs-stage[data-plate="diag-slash"] .vs-plate {
    background: linear-gradient(180deg, rgba(8, 10, 16, 0.15) 0%, rgba(8, 10, 16, 0.84) 100%);
    border: none;
    border-bottom: 4px solid #ffffff;
    border-radius: 0;
    box-shadow: 0 18px 34px rgba(0, 0, 0, 0.55);
    padding: 10px 30px 14px;
  }
  #vs-stage[data-plate="diag-slash"] .vs-plate.left {
    left: 28px;
    transform-origin: bottom left;
    transform: scale(var(--plate-scale, 1)) rotate(8.5deg);
  }
  #vs-stage[data-plate="diag-slash"] .vs-plate.right {
    right: 28px;
    transform-origin: bottom right;
    transform: scale(var(--plate-scale, 1)) rotate(-8.5deg);
  }

  .vs-avatar-badge {
    display: none;
    flex: 0 0 98px;
    width: 98px; height: 98px;
    border-radius: 14px;
    overflow: hidden;
    border: 3px solid rgba(255, 255, 255, 0.85);
    background: #141926;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.55);
  }
  .vs-avatar-badge.active { display: block; }
  .vs-avatar-badge img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .vs-plate-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .vs-plate.right .vs-plate-body { align-items: flex-end; }
  .vs-meta-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .vs-plate.right .vs-meta-row { justify-content: flex-end; }

  .vs-sponsor { font-size: calc(26px * var(--sponsor-scale, 1)); font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--vs-plate-sponsor, var(--vs-accent)); }
  .vs-sponsor:empty { display: none; }
  .vs-bracket { padding: 2px 9px; border-radius: 4px; font-size: calc(20px * var(--sponsor-scale, 1)); font-weight: 900; background: rgba(255,255,255,0.14); color: var(--vs-plate-text); }
  .vs-bracket:empty { display: none; }
  .vs-bracket.W { background: rgba(34, 197, 94, 0.22); color: #86efac; border: 1px solid rgba(34, 197, 94, 0.45); }
  .vs-bracket.L { background: rgba(239, 68, 68, 0.22); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.45); }
  .vs-seed { padding: 2px 10px; border-radius: 4px; font-size: calc(18px * var(--sponsor-scale, 1)); font-weight: 900; letter-spacing: 0.06em; background: rgba(12, 16, 28, 0.92); color: #fde047; border: 1.5px solid #facc15; box-shadow: 0 2px 6px rgba(0,0,0,0.35); white-space: nowrap; }
  .vs-seed:empty { display: none; }

  .vs-flags { display: inline-flex; align-items: center; gap: 6px; }
  .vs-flags:empty { display: none; }
  .vs-flag-box {
    width: calc(44px * var(--flag-scale, 1));
    height: calc(29px * var(--flag-scale, 1));
    border-radius: 3px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.28);
    display: inline-block;
  }
  .vs-flag-box svg { width: 100%; height: 100%; display: block; }

  .vs-player-name {
    font-family: var(--vs-font-display);
    font-size: calc(62px * var(--name-scale, 1));
    font-weight: 900;
    line-height: 1;
    letter-spacing: 0.02em;
    color: var(--vs-plate-text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
    text-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
  }
  .vs-char-sub {
    font-size: calc(24px * var(--char-name-scale, 1));
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0.78;
  }
  .vs-char-sub:empty { display: none; }

  .vs-score-box {
    display: none;
    flex: 0 0 calc(84px * var(--score-scale, 1));
    height: calc(94px * var(--score-scale, 1));
    border-radius: 10px;
    align-items: center;
    justify-content: center;
    font-family: var(--vs-font-display);
    font-size: calc(58px * var(--score-scale, 1));
    font-weight: 900;
    color: var(--vs-plate-score-text, #fff);
    background: var(--vs-plate-score-bg, var(--vs-p1));
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
  }
  .vs-plate.right .vs-score-box { background: var(--vs-plate-score-bg, var(--vs-p2)); }
  .vs-score-box.active { display: flex; }

  /* H2H Pill, Tournament Logo (4 positions), Footer Subtitle */
  .vs-h2h-pill {
    position: absolute;
    left: 50%;
    bottom: var(--h2h-bottom, 84px);
    transform: translateX(-50%);
    z-index: 16;
    display: none;
    align-items: center;
    gap: 14px;
    padding: 8px 28px;
    border-radius: 999px;
    background: rgba(8, 10, 18, 0.92);
    border: 2px solid var(--vs-accent);
    color: #fff;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.65);
  }
  .vs-h2h-pill.active { display: flex; }
  .vs-h2h-pill b { color: var(--vs-accent); font-size: 30px; }

  .vs-logo-slot {
    position: absolute;
    z-index: 18;
    display: none;
    align-items: center;
    transform-origin: bottom left;
    transform: scale(var(--logo-scale, 1));
  }
  .vs-logo-slot.active { display: flex; }
  .vs-logo-slot[data-pos="bottom-left"]   { left: 44px;  bottom: 24px; transform-origin: bottom left; }
  .vs-logo-slot[data-pos="bottom-right"]  { right: 44px; bottom: 56px; transform-origin: bottom right; }
  .vs-logo-slot[data-pos="bottom-center"] { left: 50%;   bottom: 20px; transform-origin: bottom center; transform: translateX(-50%) scale(var(--logo-scale, 1)); }
  .vs-logo-slot[data-pos="top-left"]      { left: 44px;  top: 24px;    transform-origin: top left; }
  .vs-logo-slot[data-pos="top-right"]     { right: 44px; top: 24px;    transform-origin: top right; }
  .vs-logo-slot img { max-width: 240px; max-height: 104px; object-fit: contain; border-radius: 10px; filter: drop-shadow(0 6px 16px rgba(0,0,0,0.65)); }

  .vs-subtitle-slot {
    position: absolute;
    right: 48px;
    bottom: 22px;
    z-index: 18;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.88);
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
  }
  .vs-subtitle-slot:empty { display: none; }

  /* =========================================================================
     10. 10 OBS SCENE ENTRY CHOREOGRAPHIES (SCALED BY --entry-mult)
     ========================================================================= */
  #vs-stage.anim-slam-split .vs-side.left  { animation: vsSlamLeft  calc(0.68s * var(--entry-mult)) cubic-bezier(0.16, 1, 0.3, 1) both; }
  #vs-stage.anim-slam-split .vs-side.right { animation: vsSlamRight calc(0.68s * var(--entry-mult)) cubic-bezier(0.16, 1, 0.3, 1) both; }
  #vs-stage.anim-slam-split .vs-plate.left  { animation: vsPlateLeft  calc(0.58s * var(--entry-mult)) calc(0.16s * var(--entry-mult)) cubic-bezier(0.16, 1, 0.3, 1) both; }
  #vs-stage.anim-slam-split .vs-plate.right { animation: vsPlateRight calc(0.58s * var(--entry-mult)) calc(0.16s * var(--entry-mult)) cubic-bezier(0.16, 1, 0.3, 1) both; }
  #vs-stage.anim-slam-split .vs-emblem      { animation: vsEmblemSlam calc(0.62s * var(--entry-mult)) calc(0.22s * var(--entry-mult)) cubic-bezier(0.18, 1.28, 0.32, 1) both; }
  #vs-stage.anim-slam-split .vs-top-header  { animation: vsTopDrop    calc(0.52s * var(--entry-mult)) calc(0.08s * var(--entry-mult)) cubic-bezier(0.16, 1, 0.3, 1) both; }

  #vs-stage.anim-curtain .vs-bg-half.left  { animation: vsSlamLeft  calc(0.6s * var(--entry-mult)) ease-out both; }
  #vs-stage.anim-curtain .vs-bg-half.right { animation: vsSlamRight calc(0.6s * var(--entry-mult)) ease-out both; }
  #vs-stage.anim-curtain .vs-side          { animation: vsFadeUp    calc(0.62s * var(--entry-mult)) calc(0.16s * var(--entry-mult)) cubic-bezier(0.16, 1, 0.3, 1) both; }
  #vs-stage.anim-curtain .vs-plate         { animation: vsFadeUp    calc(0.54s * var(--entry-mult)) calc(0.26s * var(--entry-mult)) cubic-bezier(0.16, 1, 0.3, 1) both; }
  #vs-stage.anim-curtain .vs-emblem        { animation: vsEmblemSlam calc(0.55s * var(--entry-mult)) calc(0.3s * var(--entry-mult)) ease-out both; }

  #vs-stage.anim-zoom-burst .vs-side   { animation: vsZoomIn calc(0.64s * var(--entry-mult)) cubic-bezier(0.16, 1, 0.3, 1) both; }
  #vs-stage.anim-zoom-burst .vs-emblem { animation: vsEmblemSlam calc(0.58s * var(--entry-mult)) calc(0.14s * var(--entry-mult)) cubic-bezier(0.18, 1.35, 0.32, 1) both; }
  #vs-stage.anim-zoom-burst .vs-plate  { animation: vsFadeUp calc(0.55s * var(--entry-mult)) calc(0.22s * var(--entry-mult)) ease-out both; }

  #vs-stage.anim-diag-slash .vs-side.left  { animation: vsSlashL calc(0.62s * var(--entry-mult)) cubic-bezier(0.16, 1, 0.3, 1) both; }
  #vs-stage.anim-diag-slash .vs-side.right { animation: vsSlashR calc(0.62s * var(--entry-mult)) cubic-bezier(0.16, 1, 0.3, 1) both; }
  #vs-stage.anim-diag-slash .vs-divider    { animation: vsDivDrop calc(0.45s * var(--entry-mult)) ease-out both; }
  #vs-stage.anim-diag-slash .vs-emblem     { animation: vsEmblemSlam calc(0.52s * var(--entry-mult)) calc(0.2s * var(--entry-mult)) cubic-bezier(0.18, 1.3, 0.32, 1) both; }
  #vs-stage.anim-diag-slash .vs-plate      { animation: vsFadeUp calc(0.5s * var(--entry-mult)) calc(0.24s * var(--entry-mult)) ease-out both; }

  #vs-stage.anim-shatter-drop .vs-top-header { animation: vsTopDrop calc(0.48s * var(--entry-mult)) both; }
  #vs-stage.anim-shatter-drop .vs-side.left  { animation: vsDropDown calc(0.62s * var(--entry-mult)) calc(0.1s * var(--entry-mult)) cubic-bezier(0.16, 1, 0.3, 1) both; }
  #vs-stage.anim-shatter-drop .vs-side.right { animation: vsDropDown calc(0.62s * var(--entry-mult)) calc(0.2s * var(--entry-mult)) cubic-bezier(0.16, 1, 0.3, 1) both; }
  #vs-stage.anim-shatter-drop .vs-plate      { animation: vsFadeUp calc(0.52s * var(--entry-mult)) calc(0.32s * var(--entry-mult)) ease-out both; }
  #vs-stage.anim-shatter-drop .vs-emblem     { animation: vsEmblemSlam calc(0.55s * var(--entry-mult)) calc(0.36s * var(--entry-mult)) both; }

  #vs-stage.anim-clash-collide .vs-side.left  { animation: vsCollideL calc(0.7s * var(--entry-mult)) cubic-bezier(0.12, 1, 0.25, 1) both; }
  #vs-stage.anim-clash-collide .vs-side.right { animation: vsCollideR calc(0.7s * var(--entry-mult)) cubic-bezier(0.12, 1, 0.25, 1) both; }
  #vs-stage.anim-clash-collide .vs-emblem     { animation: vsEmblemSlam calc(0.5s * var(--entry-mult)) calc(0.28s * var(--entry-mult)) cubic-bezier(0.18, 1.4, 0.32, 1) both; }
  #vs-stage.anim-clash-collide .vs-plate      { animation: vsFadeUp calc(0.48s * var(--entry-mult)) calc(0.32s * var(--entry-mult)) ease-out both; }

  #vs-stage.anim-cyber-glitch { animation: vsGlitchIn calc(0.64s * var(--entry-mult)) steps(4) both; }
  #vs-stage.anim-cinema-pan .vs-side.left  { animation: vsPanL calc(0.95s * var(--entry-mult)) cubic-bezier(0.22, 1, 0.36, 1) both; }
  #vs-stage.anim-cinema-pan .vs-side.right { animation: vsPanR calc(0.95s * var(--entry-mult)) cubic-bezier(0.22, 1, 0.36, 1) both; }
  #vs-stage.anim-cinema-pan .vs-plate      { animation: vsSimpleFade calc(0.7s * var(--entry-mult)) calc(0.3s * var(--entry-mult)) ease both; }
  #vs-stage.anim-wipe-iris                 { animation: vsIrisIn calc(0.72s * var(--entry-mult)) cubic-bezier(0.16, 1, 0.3, 1) both; }
  #vs-stage.anim-fade                      { animation: vsSimpleFade calc(0.58s * var(--entry-mult)) ease both; }

  @keyframes vsSlamLeft  { from { opacity: 0; transform: translate3d(-260px, 0, 0) scale(1.06); } to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); } }
  @keyframes vsSlamRight { from { opacity: 0; transform: translate3d(260px, 0, 0) scale(1.06); }  to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); } }
  @keyframes vsPlateLeft  { from { opacity: 0; transform: translate3d(-120px, 24px, 0) scale(var(--plate-scale, 1)); } to { opacity: var(--plate-op, 0.96); transform: translate3d(0, 0, 0) scale(var(--plate-scale, 1)); } }
  @keyframes vsPlateRight { from { opacity: 0; transform: translate3d(120px, 24px, 0) scale(var(--plate-scale, 1)); }  to { opacity: var(--plate-op, 0.96); transform: translate3d(0, 0, 0) scale(var(--plate-scale, 1)); } }
  @keyframes vsEmblemSlam { 0% { opacity: 0; transform: translate(-50%, -50%) scale(calc(var(--emb-scale, 1) * 2.3)) rotate(-8deg); } 70% { opacity: 1; transform: translate(-50%, -50%) scale(calc(var(--emb-scale, 1) * 0.94)) rotate(1deg); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(var(--emb-scale, 1)) rotate(0); } }
  @keyframes vsTopDrop   { from { opacity: 0; transform: translate3d(0, -100%, 0) scale(var(--hdr-scale, 1)); } to { opacity: 1; transform: translate3d(0, 0, 0) scale(var(--hdr-scale, 1)); } }
  @keyframes vsFadeUp    { from { opacity: 0; transform: translate3d(0, 48px, 0); } to { opacity: 1; transform: translate3d(0, 0, 0); } }
  @keyframes vsZoomIn    { from { opacity: 0; transform: scale(1.24); } to { opacity: 1; transform: scale(1); } }
  @keyframes vsSlashL    { from { opacity: 0; transform: translate3d(-320px, -120px, 0) skewX(-16deg); filter: brightness(1.8); } to { opacity: 1; transform: none; filter: none; } }
  @keyframes vsSlashR    { from { opacity: 0; transform: translate3d(320px, 120px, 0) skewX(16deg); filter: brightness(1.8); } to { opacity: 1; transform: none; filter: none; } }
  @keyframes vsDivDrop   { from { opacity: 0; transform: translateX(-50%) skewX(var(--div-tilt, 0deg)) scaleY(0); } to { opacity: 1; transform: translateX(-50%) skewX(var(--div-tilt, 0deg)) scaleY(1); } }
  @keyframes vsDropDown  { from { opacity: 0; transform: translate3d(0, -220px, 0); } to { opacity: 1; transform: none; } }
  @keyframes vsCollideL  { 0% { opacity: 0; transform: translate3d(-460px, 0, 0); } 65% { opacity: 1; transform: translate3d(34px, 0, 0); } 100% { opacity: 1; transform: none; } }
  @keyframes vsCollideR  { 0% { opacity: 0; transform: translate3d(460px, 0, 0); } 65% { opacity: 1; transform: translate3d(-34px, 0, 0); } 100% { opacity: 1; transform: none; } }
  @keyframes vsGlitchIn  { 0% { opacity: 0; filter: hue-rotate(110deg) contrast(2.2); transform: skewX(12deg); } 45% { opacity: 0.9; filter: hue-rotate(-50deg) contrast(1.5); transform: skewX(-6deg); } 100% { opacity: 1; filter: none; transform: none; } }
  @keyframes vsPanL      { from { opacity: 0; transform: translate3d(-90px, 0, 0) scale(1.06); } to { opacity: 1; transform: none; } }
  @keyframes vsPanR      { from { opacity: 0; transform: translate3d(90px, 0, 0) scale(1.06); } to { opacity: 1; transform: none; } }
  @keyframes vsIrisIn    { from { clip-path: circle(0% at 50% 50%); opacity: 0.2; } to { clip-path: circle(120% at 50% 50%); opacity: 1; } }
  @keyframes vsSimpleFade { from { opacity: 0; } to { opacity: 1; } }

  /* =========================================================================
     11. INTERACTIVE CLICK-TO-SELECT STUDIO OVERLAY (PREVIEW MODE ONLY!)
     ========================================================================= */
  body.interactive-edit .vs-hit {
    pointer-events: auto !important;
    cursor: pointer;
  }
  body.interactive-edit .vs-hit:hover {
    outline: 4px dashed rgba(56, 189, 248, 0.92);

<script>
(() => {
  const FLAGS_MAP = window.FGC_FLAGS || {};
  const DESIGN_MAP = window.FGC_VS_DESIGN_MAP || {};
  const FALLBACK_DESIGN = (window.FGC_VS_DESIGNS && window.FGC_VS_DESIGNS[0]) || {
    id: 'arcade-pop', split: 'vertical', frame: 'arcade-teeth', divider: 'x-tape', divAnim: 'scroll-down', divW: 28, divTilt: 0,
    emblem: 'winged', embAnim: 'pulse', plate: 'arcade-box', plateBottom: 176, header: 'trapezoid', pat: 'symbols', patOp: 22, wmOp: 0,
    ambient: 'none', font: 'Russo One', lightBg: true, bgLeft: '#f5b800', bgRight: '#f5b800', p1: '#ff3b1f', p2: '#1d4ed8',
    accent: '#ffd400', divColor: '#ffffff', plateBg: 'rgba(10,10,14,0.96)', plateText: '#ffffff',
    headerBg: '#0a0b10', headerText: '#ffffff', frameColor: '#0a0b10', frameAccent: '#ffffff'
  };
  const FONT_STACKS = {
    'Barlow Condensed': `'Barlow Condensed', 'Bahnschrift', sans-serif`,
    'Chakra Petch':     `'Chakra Petch', 'Bahnschrift', sans-serif`,
    'Orbitron':         `'Orbitron', 'Chakra Petch', sans-serif`,
    'Teko':             `'Teko', 'Barlow Condensed', sans-serif`,
    'Russo One':        `'Russo One', 'Impact', sans-serif`,
    'Oswald':           `'Oswald', 'Barlow Condensed', sans-serif`,
    'Bebas Neue':       `'Bebas Neue', 'Impact', sans-serif`,
    'Anton':            `'Anton', 'Impact', sans-serif`,
    'Exo 2':            `'Exo 2', 'Segoe UI', sans-serif`,
    'Black Ops One':    `'Black Ops One', 'Impact', sans-serif`,
    'Montserrat':       `'Montserrat', 'Segoe UI', sans-serif`
  };
  const ENTRY_CLASSES = [
    'anim-slam-split', 'anim-curtain', 'anim-zoom-burst', 'anim-diag-slash',
    'anim-shatter-drop', 'anim-clash-collide', 'anim-cyber-glitch', 'anim-cinema-pan',
    'anim-wipe-iris', 'anim-fade'
  ];

  const qs = new URLSearchParams(location.search);
  const isPreview = qs.has('preview');
  const isExport = qs.has('export');
  const forcedVsMode = (qs.get('mode') || '').toLowerCase();
  const isHttp = location.protocol === 'http:' || location.protocol === 'https:';
  const $ = (id) => document.getElementById(id);

  let currentScale = 1;
  let interactiveEdit = isPreview;
  let dragEnabled = isPreview;
  let selectedElement = '';
  let selectedMuKey = '';
  let currentState = null;
  let historyDb = [];
  let lastIntroNonce = 0;
  let lastImgSrc = { p1Char: '', p2Char: '', p1Av: '', p2Av: '' };

  if (isPreview) document.body.classList.add('preview-mode', 'interactive-edit');
  const rescalePreview = () => {
    const w = window.innerWidth;
    const h = window.innerHeight;
    if (!w || !h) return;
    if (!isPreview && w === 1920 && h === 1080) {
      currentScale = 1;
      $('vs-scaler').style.transform = 'none';
      document.body.classList.remove('fitted-letterbox');
      return;
    }
    currentScale = Math.min(w / 1920, h / 1080);
    const ox = Math.max(0, (w - 1920 * currentScale) / 2);
    const oy = Math.max(0, (h - 1080 * currentScale) / 2);
    $('vs-scaler').style.transform = `translate(${ox.toFixed(1)}px, ${oy.toFixed(1)}px) scale(${currentScale})`;
    const isTransparent = currentState?.vs?.bgMode === 'transparent';
    document.body.classList.toggle('fitted-letterbox', !window.obsstudio && !isTransparent);
  };
  window.addEventListener('resize', rescalePreview);
  rescalePreview();

  function norm(s) {
    return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  }
  function resolveAvatarSrc(raw) {
    const u = String(raw || '').trim();
    if (!u) return '';
    if (u.startsWith('/media/') || u.startsWith('data:')) return u;
    if (/^https?:\/\//i.test(u) && isHttp) return `/api/avatar-proxy?url=${encodeURIComponent(u)}`;
    return u;
  }
  function buildCharRenderUrl(game, pack, charName) {
    if (!charName || !String(charName).trim() || !isHttp) return '';
    return `/api/assets/render?game=${encodeURIComponent(game || 'tekken8')}&pack=${encodeURIComponent(pack || 'full')}&char=${encodeURIComponent(charName.trim())}`;
  }
  function getActiveMatchData(st) {
    const vs = st.vs || {};
    if (vs.source === 'next' && vs.nextMatch?.p1?.name) {
      return { round: vs.nextMatch.roundText || vs.nextMatch.round || st.round || 'UP NEXT', format: st.format || 'FT3', p1: vs.nextMatch.p1, p2: vs.nextMatch.p2 };
    }
    if (vs.source === 'custom' && vs.customMatch) {
      return { round: vs.customMatch.round || 'GRAND FINALS', format: vs.customMatch.format ?? st.format ?? 'FT3', p1: vs.customMatch.p1 || st.p1, p2: vs.customMatch.p2 || st.p2 };
    }
    return { round: st.round || 'ROUND 1', format: st.format || '', p1: st.p1 || {}, p2: st.p2 || {} };
  }
  function computeH2H(nameA, nameB) {
    const a = norm(nameA), b = norm(nameB);
    if (!a || !b || a === b) return { winsA: 0, winsB: 0, total: 0 };
    let winsA = 0, winsB = 0;
    for (const h of historyDb) {
      const p1 = norm(h.p1?.name), p2 = norm(h.p2?.name);
      if (p1 === a && p2 === b) { if (h.winnerSide === 'p1') winsA++; else winsB++; }
      else if (p1 === b && p2 === a) { if (h.winnerSide === 'p1') winsB++; else winsA++; }
    }
    return { winsA, winsB, total: winsA + winsB };
  }

  function resolvePlayerFlags(player, vs) {
    const fMode = vs.flagMode || (vs.showFlags === false ? 'none' : 'both');
    if (fMode === 'none') return [];
    const wantCountry = fMode === 'both' || fMode === 'country';
    const wantRegion = fMode === 'both' || fMode === 'region';
    const cCode = wantCountry ? String(player.flag || '').toUpperCase().trim() : '';
    let rCode = wantRegion ? String(player.region || '').toUpperCase().trim() : '';
    if (cCode && rCode && cCode === rCode) rCode = '';
    const f1 = cCode && FLAGS_MAP[cCode] ? FLAGS_MAP[cCode] : null;
    const f2 = rCode && FLAGS_MAP[rCode] ? FLAGS_MAP[rCode] : null;
    return [f1, f2].filter(Boolean);
  }

  function resolvePlateBgFlags(player, vs) {
    const src = vs.plateFlagBgSource || 'country';
    const cCode = String(player.flag || '').toUpperCase().trim();
    const rCode = String(player.region || '').toUpperCase().trim();
    const fc = cCode && FLAGS_MAP[cCode] ? FLAGS_MAP[cCode] : null;
    const fr = rCode && FLAGS_MAP[rCode] ? FLAGS_MAP[rCode] : null;
    if (vs.plateFlagBg === 'dual-split' || src === 'both') {
      const list = [fc, (fr && rCode !== cCode) ? fr : null].filter(Boolean);
      return list.length ? list : [fc || fr].filter(Boolean);
    }
    if (src === 'region') return [fr || fc].filter(Boolean);
    return [fc || fr].filter(Boolean);
  }

  function renderSideFlags(side, containerId, wmId, player, vs) {
    const cont = $(containerId);
    const wm = $(wmId);
    const list = resolvePlayerFlags(player, vs);
    const boxesHtml = list.map(f => `<span class="vs-flag-box">${f.svg}</span>`).join('');
    cont.innerHTML = boxesHtml;
    wm.innerHTML = list[0] ? list[0].svg : '';

    // Dedicated vertical flag strip (outer-strip / inner-strip)
    const strip = $(`${side}-plate-flag-strip`);
    const flagPos = vs.plateFlagPos || 'meta';
    if (strip) {
      const showStrip = (flagPos === 'outer-strip' || flagPos === 'inner-strip') && list.length > 0;
      strip.innerHTML = showStrip ? boxesHtml : '';
      strip.classList.toggle('active', showStrip);
    }

    // Plate Flag Background & Fade Studio layer
    const bgWrap = $(`${side}-plate-flag-bg`);
    const bgInner = $(`${side}-plate-flag-bg-inner`);
    if (bgWrap && bgInner) {
      const bgMode = vs.plateFlagBg || 'off';
      const bgFlags = bgMode !== 'off' ? resolvePlateBgFlags(player, vs) : [];
      if (bgFlags.length) {
        const ordered = (side === 'p2' && bgFlags.length > 1) ? [...bgFlags].reverse() : bgFlags;
        const sig = `${bgMode}|${ordered.map(f => f.code || f.name).join(',')}`;
        if (bgInner.dataset.flagSig !== sig) {
          bgInner.dataset.flagSig = sig;
          bgInner.innerHTML = ordered.map(f => `<div class="pfb-tile">${f.svg.replace('<svg ', '<svg preserveAspectRatio="none" ')}</div>`).join('');
        }
        bgWrap.classList.add('has-flag');
      } else {
        bgWrap.classList.remove('has-flag');
      }
    }
  }

  const opticalShiftCache = new Map();
  function computeOpticalShiftRatio(im, cacheKey) {
    if (cacheKey && opticalShiftCache.has(cacheKey)) return opticalShiftCache.get(cacheKey);
    let ratio = 0;
    try {
      const nw = im?.naturalWidth || 0, nh = im?.naturalHeight || 0;
      if (nw > 4 && nh > 4) {
        const cw = 96, ch = Math.max(16, Math.round((nh / nw) * 96));
        const c = document.createElement('canvas');
        c.width = cw; c.height = ch;
        const ctx = c.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(im, 0, 0, cw, ch);
        const data = ctx.getImageData(0, 0, cw, ch).data;
        const yMax = Math.max(8, Math.floor(ch * 0.78));
        let minX = cw, maxX = -1;
        for (let y = 0; y < yMax; y++) {
          const rowOff = y * cw * 4;
          for (let x = 0; x < cw; x++) {
            if (data[rowOff + x * 4 + 3] > 28) {
              if (x < minX) minX = x;
              if (x > maxX) maxX = x;
            }
          }
        }
        if (maxX > minX) {
          const delta = 0.5 - ((minX + maxX) / 2) / cw;
          if (Math.abs(delta) > 0.03) ratio = Math.max(-0.35, Math.min(0.35, delta));
        }
      }
    } catch {}
    if (cacheKey) opticalShiftCache.set(cacheKey, ratio);
    return ratio;
  }

  function updateSideVisuals(side, player, vs) {
    const charImg = $(`${side}-char-img`);
    const sideEl = $(`${side}-side`);
    const heroAvBox = $(`${side}-hero-avatar`);
    const heroAvImg = $(`${side}-hero-avatar-img`);
    const badgeAvBox = $(`${side}-avatar-badge`);
    const badgeAvImg = $(`${side}-avatar-badge-img`);
    const fallbackEl = $(`${side}-fallback`);

    const charName = String(player.character || '').trim();
    const charUrl = buildCharRenderUrl(vs.game || 'tekken8', vs.pack || 'full', charName);
    const avUrl = resolveAvatarSrc(player.avatar);
    const avMode = vs.design === 'portrait-cards' && vs.avatarMode === 'badge' ? 'portrait-hero' : (vs.avatarMode || 'hero-fallback');

    const applyAvatarVisibility = () => {
      const hasCharLoaded = Boolean(charUrl && charImg.classList.contains('loaded'));
      const hasAv = Boolean(avUrl);
      const showHeroAv = hasAv && (
        avMode === 'portrait-hero' ||
        (avMode === 'hero-fallback' && !hasCharLoaded) ||
        (vs.design === 'portrait-cards' && avMode !== 'off')
      );
      const showBadgeAv = hasAv && !showHeroAv && (avMode === 'badge' || avMode === 'hero-fallback');
      heroAvBox.classList.toggle('active', showHeroAv);
      sideEl.classList.toggle('has-hero-avatar', showHeroAv);
      badgeAvBox.classList.toggle('active', showBadgeAv);
      fallbackEl.classList.toggle('active', !hasCharLoaded && !showHeroAv);
    };

    const applyOpticalCenter = () => {
      const ratio = computeOpticalShiftRatio(charImg, charUrl);
      const renderedW = charImg.clientWidth || Math.min(864, 920 * ((charImg.naturalWidth || 1) / (charImg.naturalHeight || 1)));
      document.documentElement.style.setProperty(`--${side}-auto-x`, `${Math.round(ratio * renderedW)}px`);
    };

    const avKey = `${side}Av`;
    if (lastImgSrc[avKey] !== avUrl) {
      lastImgSrc[avKey] = avUrl;
      if (avUrl) { heroAvImg.src = avUrl; badgeAvImg.src = avUrl; }
      else { heroAvImg.removeAttribute('src'); badgeAvImg.removeAttribute('src'); }
    }
    const chKey = `${side}Char`;
    if (lastImgSrc[chKey] !== charUrl) {
      lastImgSrc[chKey] = charUrl;
      if (charUrl) {
        charImg.classList.add('loading');
        const markLoaded = () => {
          charImg.classList.remove('loading');
          charImg.classList.add('loaded');
          applyOpticalCenter();
          applyAvatarVisibility();
        };
        charImg.onload = markLoaded;
        charImg.onerror = () => {
          charImg.classList.remove('loading', 'loaded');
          document.documentElement.style.setProperty(`--${side}-auto-x`, '0px');
          if (lastImgSrc[chKey] === charUrl) lastImgSrc[chKey] = '';
          applyAvatarVisibility();
        };
        charImg.src = charUrl;
        if (charImg.complete && charImg.naturalWidth > 0) markLoaded();
      } else {
        charImg.classList.remove('loading', 'loaded');
        document.documentElement.style.setProperty(`--${side}-auto-x`, '0px');
        charImg.removeAttribute('src');
      }
    } else if (charUrl && charImg.classList.contains('loaded')) {
      applyOpticalCenter();
    }
    fallbackEl.textContent = (String(player.name || side.toUpperCase()).trim().slice(0, 2) || side.toUpperCase()).toUpperCase();
    applyAvatarVisibility();
  }

  function triggerEntryAnim(animName) {
    const stage = $('vs-stage');
    stage.classList.remove(...ENTRY_CLASSES);
    void stage.offsetWidth;
    const cls = `anim-${animName || 'slam-split'}`;
    stage.classList.add(ENTRY_CLASSES.includes(cls) ? cls : 'anim-slam-split');
  }

  function speedToDuration(speed0to100, slowSec, fastSec) {
    const s = Math.max(0, Math.min(100, Number(speed0to100 ?? 45)));
    if (s === 0) return { paused: true, dur: `${slowSec}s` };
    // Exponential curve so both very slow and very fast feel natural
    const t = s / 100;
    const sec = slowSec * Math.pow(fastSec / slowSec, t);
    return { paused: false, dur: `${sec.toFixed(2)}s` };
  }

  function render(st) {

  /* =========================================================================
     INTERACTIVE CLICK-TO-SELECT & DIRECT DRAG STUDIO (PREVIEW MODE ONLY!)
     ========================================================================= */
  function highlightSelectedEl(elKey) {
    selectedElement = elKey || '';
    document.querySelectorAll('.vs-hit.vs-selected').forEach(n => n.classList.remove('vs-selected'));
    if (!selectedElement) return;
    document.querySelectorAll(`.vs-hit[data-vs-el="${selectedElement}"]`).forEach(n => n.classList.add('vs-selected'));
  }

  if (isPreview) {
    const hoverPill = $('vs-hover-pill');
    let dragState = null;
    let muDragState = null;
    let muWheelTimer = null;
    window.__isMuInteracting = () => Boolean(muDragState || muWheelTimer);

    const getMuPos = (key, side) => {
      const cur = (currentState?.vs?.matchupArtPos && currentState.vs.matchupArtPos[key]) || {};
      return {
        x: Number(cur.x || 0),
        y: Number(cur.y || 0),
        scale: Math.max(40, Math.min(350, Number(cur.scale ?? 100))),
        flip: (cur.flip !== undefined && cur.flip !== null) ? Boolean(cur.flip) : (side === 'p2')
      };
    };
    const applyLiveMuTransform = (halfEl, pos) => {
      const img = halfEl?.querySelector('img');
      if (!img) return;
      const gX = Number(currentState?.vs?.matchupGlobalX || 0);
      const gY = Number(currentState?.vs?.matchupGlobalY || 0);
      const gScale = Math.max(40, Math.min(350, Number(currentState?.vs?.matchupGlobalScale ?? 100))) / 100;
      const effX = gX + Number(pos.x || 0);
      const effY = gY + Number(pos.y || 0);
      const effSc = gScale * (Math.max(40, Math.min(350, Number(pos.scale ?? 100))) / 100);
      img.style.transformOrigin = '50% 130px';
      img.style.transform = `translate(${effX}px, ${effY}px) scale(${effSc.toFixed(3)}) scaleX(${pos.flip ? -1 : 1})`;
    };
    const highlightMuHalf = (key) => {
      selectedMuKey = key || '';
      document.querySelectorAll('.mu-char-hit.is-selected').forEach(n => n.classList.remove('is-selected'));
      if (selectedMuKey) {
        document.querySelectorAll(`.mu-char-hit[data-mu-key="${selectedMuKey}"]`).forEach(n => n.classList.add('is-selected'));
      }
    };
    window.__highlightMuHalf = highlightMuHalf;

    const resolveHitTarget = (e) => {
      const direct = e.target.closest('.vs-hit');
      // Make ultra-thin dividers (2px-10px) effortless to hover/click without stretching their visible width!
      if (!direct || direct.dataset.vsEl === 'backdrop') {
        const divEl = $('vs-divider');
        if (divEl && divEl.dataset.divider !== 'none') {
          const rect = divEl.getBoundingClientRect();
          const cx = (rect.left + rect.right) / 2;
          if (Math.abs(e.clientX - cx) <= 18) return divEl;
        }
      }
      return direct;
    };

    document.addEventListener('mousemove', (e) => {
      // Matchups 2x2 60fps Direct Character Drag (Horizontal X + Vertical Y!)
      if (muDragState) {
        const dx = Math.round((e.clientX - muDragState.startX) / (currentScale || 1));
        const dy = Math.round((e.clientY - muDragState.startY) / (currentScale || 1));
        if (!muDragState.moved && Math.hypot(dx, dy) > 3) muDragState.moved = true;
        if (muDragState.moved) {
          const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, Math.round(v)));
          const nextPos = {
            x: clamp(muDragState.base.x + dx, -350, 350),
            y: clamp(muDragState.base.y + dy, -550, 350),
            scale: muDragState.base.scale,
            flip: muDragState.base.flip
          };
          muDragState.lastPos = nextPos;
          applyLiveMuTransform(muDragState.el, nextPos);
          hoverPill.textContent = `✋ ${muDragState.label} · Y:${nextPos.y >= 0 ? '+' : ''}${nextPos.y}px  X:${nextPos.x >= 0 ? '+' : ''}${nextPos.x}px  ${nextPos.scale}%`;
          hoverPill.style.display = 'block';
          hoverPill.style.left = `${Math.min(window.innerWidth - 260, e.clientX + 12)}px`;
          hoverPill.style.top = `${Math.max(8, e.clientY - 30)}px`;
          window.parent?.postMessage({ type: 'vs-mu-art-patch', key: muDragState.key, pos: nextPos, label: muDragState.label, commit: false }, '*');
        }
        return;
      }

      if (dragState && dragEnabled) {
        const dx = Math.round((e.clientX - dragState.startX) / (currentScale || 1));
        const dy = Math.round((e.clientY - dragState.startY) / (currentScale || 1));
        if (!dragState.moved && Math.hypot(dx, dy) > 5) dragState.moved = true;
        if (dragState.moved) {
          const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, Math.round(v)));
          const patch = {};
          if (dragState.el === 'p1-char') {
            patch.p1OffsetX = clamp(dragState.base.p1X + dx, -450, 450);
            patch.p1OffsetY = clamp(dragState.base.p1Y + dy, -360, 360);
          } else if (dragState.el === 'p2-char') {
            patch.p2OffsetX = clamp(dragState.base.p2X + dx, -450, 450);
            patch.p2OffsetY = clamp(dragState.base.p2Y + dy, -360, 360);
          } else if (dragState.el === 'emblem') {
            patch.emblemOffsetX = clamp(dragState.base.embX + dx, -300, 300);
            patch.emblemOffsetY = clamp(dragState.base.embY + dy, -300, 300);
          } else if (dragState.el === 'header') {
            patch.headerOffsetX = clamp(dragState.base.hdrX + dx, -600, 600);
            patch.headerOffsetY = clamp(dragState.base.hdrY + dy, 0, 320);
          } else if (dragState.el === 'p1-plate' || dragState.el === 'p2-plate') {
            patch.plateBottom = clamp(dragState.base.plateB - dy, 0, 450);
            const sign = dragState.el === 'p1-plate' ? 1 : -1;
            patch.plateEdgeX = clamp(dragState.base.plateX + dx * sign, 0, 240);
          } else if (dragState.el === 'h2h') {
            patch.h2hOffsetY = clamp(dragState.base.h2hB - dy, 20, 240);
          }
          if (Object.keys(patch).length) {
            dragState.lastPatch = patch;
            window.parent?.postMessage({ type: 'vs-drag-patch', patch, commit: false }, '*');
          }
        }
        return;
      }

      if ($('vs-stage')?.dataset.viewMode === 'matchup-2x2') {
        const muHit = e.target.closest('.mu-char-hit');
        if (muHit) {
          hoverPill.textContent = `✋ Drag Y/X · Scroll Zoom · Dbl-Click Reset — ${muHit.dataset.muLabel || ''}`;
          hoverPill.style.display = 'block';
          hoverPill.style.left = `${Math.min(window.innerWidth - 320, e.clientX + 12)}px`;
          hoverPill.style.top = `${Math.max(8, e.clientY - 30)}px`;
        } else {
          hoverPill.style.display = 'none';
        }
        return;
      }

      if (!interactiveEdit) { hoverPill.style.display = 'none'; return; }
      const hit = resolveHitTarget(e);
      if (hit && hit.dataset.vsLabel) {
        hoverPill.textContent = hit.dataset.vsLabel;
        hoverPill.style.display = 'block';
        hoverPill.style.left = `${Math.min(window.innerWidth - 220, e.clientX + 12)}px`;
        hoverPill.style.top = `${Math.max(8, e.clientY - 30)}px`;
      } else {
        hoverPill.style.display = 'none';
      }
    });

    document.addEventListener('mouseleave', () => { hoverPill.style.display = 'none'; });

    document.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      if ($('vs-stage')?.dataset.viewMode === 'matchup-2x2') {
        const muHit = e.target.closest('.mu-char-hit');
        if (!muHit) return;
        const key = muHit.dataset.muKey;
        const side = muHit.dataset.muSide || 'p1';
        const label = muHit.dataset.muLabel || key;
        const base = getMuPos(key, side);
        highlightMuHalf(key);
        muHit.classList.add('is-dragging');
        muDragState = { el: muHit, key, side, label, startX: e.clientX, startY: e.clientY, moved: false, base, lastPos: base };
        e.preventDefault();
        return;
      }
      if (!interactiveEdit) return;
      const hit = resolveHitTarget(e);
      if (!hit) return;
      const elKey = hit.dataset.vsEl;
      const vs = currentState?.vs || {};
      const d = DESIGN_MAP[vs.design] || FALLBACK_DESIGN;
      dragState = {
        el: elKey,
        label: hit.dataset.vsLabel || elKey,
        startX: e.clientX,
        startY: e.clientY,
        moved: false,
        lastPatch: null,
        base: {
          p1X: Number(vs.p1OffsetX ?? 0), p1Y: Number(vs.p1OffsetY ?? 0),
          p2X: Number(vs.p2OffsetX ?? 0), p2Y: Number(vs.p2OffsetY ?? 0),
          embX: Number(vs.emblemOffsetX ?? 0), embY: Number(vs.emblemOffsetY ?? 0),
          hdrX: Number(vs.headerOffsetX ?? 0), hdrY: Number(vs.headerOffsetY ?? 0),
          plateB: (typeof vs.plateBottom === 'number' && vs.plateBottom >= 0) ? vs.plateBottom : (d.plateBottom ?? 168),
          plateX: (typeof vs.plateEdgeX === 'number' && vs.plateEdgeX >= 0) ? vs.plateEdgeX : 62,
          h2hB: Number(vs.h2hOffsetY ?? 84)
        }
      };
      e.preventDefault();
    });

    document.addEventListener('wheel', (e) => {
      if ($('vs-stage')?.dataset.viewMode !== 'matchup-2x2') return;
      const muHit = e.target.closest('.mu-char-hit');
      if (!muHit) return;
      e.preventDefault();
      const key = muHit.dataset.muKey;
      const side = muHit.dataset.muSide || 'p1';
      const label = muHit.dataset.muLabel || key;
      const cur = getMuPos(key, side);
      const delta = e.deltaY < 0 ? 6 : -6;
      const nextPos = { ...cur, scale: Math.max(40, Math.min(350, Math.round(cur.scale + delta))) };
      if (!currentState.vs.matchupArtPos) currentState.vs.matchupArtPos = {};
      currentState.vs.matchupArtPos[key] = nextPos;
      highlightMuHalf(key);
      applyLiveMuTransform(muHit, nextPos);
      hoverPill.textContent = `🔍 ${label} · ${nextPos.scale}%`;
      hoverPill.style.display = 'block';
      window.parent?.postMessage({ type: 'vs-mu-art-patch', key, pos: nextPos, label, commit: false }, '*');
      clearTimeout(muWheelTimer);
      muWheelTimer = setTimeout(() => {
        muWheelTimer = null;
        window.parent?.postMessage({ type: 'vs-mu-art-patch', key, pos: nextPos, label, commit: true }, '*');
      }, 180);
    }, { passive: false });

    document.addEventListener('dblclick', (e) => {
      if ($('vs-stage')?.dataset.viewMode !== 'matchup-2x2') return;
      const muHit = e.target.closest('.mu-char-hit');
      if (!muHit) return;
      const key = muHit.dataset.muKey;
      const side = muHit.dataset.muSide || 'p1';
      const label = muHit.dataset.muLabel || key;
      const resetPos = { x: 0, y: 0, scale: 100, flip: side === 'p2' };
      if (!currentState.vs.matchupArtPos) currentState.vs.matchupArtPos = {};
      currentState.vs.matchupArtPos[key] = resetPos;
      applyLiveMuTransform(muHit, resetPos);
      window.parent?.postMessage({ type: 'vs-mu-art-patch', key, pos: resetPos, label, commit: true }, '*');
    });

    window.addEventListener('mouseup', () => {
      if (muDragState) {
        const ms = muDragState;
        muDragState = null;
        ms.el?.classList.remove('is-dragging');
        hoverPill.style.display = 'none';
        if (ms.moved && ms.lastPos) {
          if (!currentState.vs.matchupArtPos) currentState.vs.matchupArtPos = {};
          currentState.vs.matchupArtPos[ms.key] = ms.lastPos;
          window.parent?.postMessage({ type: 'vs-mu-art-patch', key: ms.key, pos: ms.lastPos, label: ms.label, commit: true }, '*');
        }
        window.parent?.postMessage({ type: 'vs-mu-select', key: ms.key, label: ms.label }, '*');
        return;
      }
      if (!dragState) return;
      const ds = dragState;
      dragState = null;
      highlightSelectedEl(ds.el);
      if (ds.moved && ds.lastPatch) {
        window.parent?.postMessage({ type: 'vs-drag-patch', patch: ds.lastPatch, commit: true }, '*');
      }
      window.parent?.postMessage({ type: 'vs-select-element', element: ds.el, label: ds.label }, '*');
    });
  }

  /* =========================================================================
     PURE HTML5 CANVAS 1920x1080 PNG GRAPHIC EXPORTER
     ========================================================================= */
  async function loadImg(src) {
    if (!src) return null;
    return new Promise((resolve) => {
      const im = new Image();
      im.crossOrigin = 'anonymous';
      im.onload = () => resolve(im);
      im.onerror = () => resolve(null);
      im.src = src;
    });
  }
  async function loadSvgAsImg(svgText) {
    if (!svgText) return null;
    const imgMatch = String(svgText).match(/<img[^>]+src="([^"]+)"/i);
    if (imgMatch && imgMatch[1]) return loadImg(imgMatch[1]);
    const blob = new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const im = await loadImg(url);
    URL.revokeObjectURL(url);
    return im;
  }

  async function exportPngGraphic() {
    if (!currentState) return;
    const st = currentState;
    const vs = st.vs || {};
    const d = DESIGN_MAP[vs.design] || FALLBACK_DESIGN;
    const effFont = (vs.fontDisplay && vs.fontDisplay !== 'theme') ? vs.fontDisplay : (d.font || 'Russo One');
    const cFont = window.FGC_CUSTOM_FONTS?.resolveCanvasFamily(effFont, '"Russo One", "Barlow Condensed", sans-serif') || '"Russo One", "Barlow Condensed", sans-serif';
    if (document.fonts?.ready) { try { await document.fonts.ready; } catch {} }
    const match = getActiveMatchData(st);
    const p1 = match.p1 || {}, p2 = match.p2 || {};
    const pickHex = (str, fb) => (String(str || '').match(/#[0-9a-fA-F]{6}/) || [fb])[0];

    const canvas = document.createElement('canvas');
    canvas.width = 1920; canvas.height = 1080;
    const ctx = canvas.getContext('2d');

    if (vs.bgMode !== 'transparent') {
      const c1 = vs.bgMode === 'custom' ? (vs.p1Color || d.p1) : pickHex(d.bgLeft, d.p1);
      const c2 = vs.bgMode === 'custom' ? (vs.p2Color || d.p2) : pickHex(d.bgRight, d.p2);
      const dark = vs.bgMode === 'custom' ? (vs.bgColor2 || '#0b0e16') : (d.lightBg ? '#e2e8f0' : '#080a12');
      const g1 = ctx.createRadialGradient(480, 460, 80, 480, 540, 980);
      g1.addColorStop(0, c1); g1.addColorStop(1, dark);
      ctx.fillStyle = g1; ctx.fillRect(0, 0, 960, 1080);
      const g2 = ctx.createRadialGradient(1440, 460, 80, 1440, 540, 980);
      g2.addColorStop(0, c2); g2.addColorStop(1, dark);
      ctx.fillStyle = g2; ctx.fillRect(960, 0, 960, 1080);

      const effDiv = (vs.dividerStyle && vs.dividerStyle !== 'theme') ? vs.dividerStyle : d.divider;
      if (effDiv !== 'none') {
        const w = Number(vs.dividerWidth) > 0 ? Number(vs.dividerWidth) : (d.divW || 8);
        ctx.fillStyle = vs.dividerColor || d.divColor || '#ffffff';
        ctx.fillRect(960 - w / 2, 0, w, 1080);
      }
    }

    const [p1CharIm, p2CharIm, p1AvIm, p2AvIm, logoIm] = await Promise.all([
      loadImg(buildCharRenderUrl(vs.game, vs.pack, p1.character)),
      loadImg(buildCharRenderUrl(vs.game, vs.pack, p2.character)),
      loadImg(resolveAvatarSrc(p1.avatar)),
      loadImg(resolveAvatarSrc(p2.avatar)),
      vs.showLogo !== false && vs.logoUrl ? loadImg(resolveAvatarSrc(vs.logoUrl)) : Promise.resolve(null)
    ]);

    const drawChar = (im, side, cx, zoom, offX, offY, flip, dim) => {
      if (!im) return;
      const targetH = 900 * (zoom / 100);
      const scale = targetH / im.naturalHeight;
      const w = im.naturalWidth * scale, h = im.naturalHeight * scale;
      const optShiftX = computeOpticalShiftRatio(im, im.src) * w;
      ctx.save();
      ctx.beginPath();
      if (side === 'p1') ctx.rect(0, 0, 960, 1080);
      else ctx.rect(960, 0, 960, 1080);
      ctx.clip();
      ctx.globalAlpha = dim ? 0.25 : 1;
      ctx.translate(cx + offX, 540 + offY);
      ctx.scale(flip ? -1 : 1, 1);
      ctx.translate(optShiftX, 0);
      ctx.shadowColor = `rgba(0,0,0,${((Number(vs.charShadow ?? 60) / 100) * 0.9).toFixed(2)})`;
      ctx.shadowBlur = 28; ctx.shadowOffsetY = 16;
      ctx.drawImage(im, -w / 2, -h / 2, w, h);
      ctx.restore();
    };
    const drawHeroAv = (im, cx, borderColor) => {
      if (!im) return;
      const sz = 440, x = cx - sz / 2, y = 210;
      ctx.save();
      ctx.beginPath(); ctx.roundRect(x, y, sz, sz, 26); ctx.clip();
      const s = Math.max(sz / im.naturalWidth, sz / im.naturalHeight);
      ctx.drawImage(im, cx - (im.naturalWidth * s) / 2, y + sz / 2 - (im.naturalHeight * s) / 2, im.naturalWidth * s, im.naturalHeight * s);
      ctx.restore();
      ctx.lineWidth = 8; ctx.strokeStyle = borderColor;
      ctx.beginPath(); ctx.roundRect(x, y, sz, sz, 26); ctx.stroke();
    };

    const avMode = vs.design === 'portrait-cards' && vs.avatarMode === 'badge' ? 'portrait-hero' : (vs.avatarMode || 'hero-fallback');
    const p1Hero = Boolean(p1AvIm && (avMode === 'portrait-hero' || (avMode === 'hero-fallback' && !p1CharIm)));
    const p2Hero = Boolean(p2AvIm && (avMode === 'portrait-hero' || (avMode === 'hero-fallback' && !p2CharIm)));
    drawChar(p1CharIm, 'p1', 480, Number(vs.p1Zoom ?? 100), Number(vs.p1OffsetX ?? 0), Number(vs.p1OffsetY ?? 0), Boolean(vs.p1Flip), p1Hero);
    drawChar(p2CharIm, 'p2', 1440, Number(vs.p2Zoom ?? 100), Number(vs.p2OffsetX ?? 0), Number(vs.p2OffsetY ?? 0), vs.p2Flip !== false, p2Hero);
    if (p1Hero) drawHeroAv(p1AvIm, 480, vs.p1Color || d.p1);
    if (p2Hero) drawHeroAv(p2AvIm, 1440, vs.p2Color || d.p2);

    // 4-Side Stylized Edge Bands (PNG Export)
    const bt = Number(vs.bandThickness ?? 28);
    if (vs.bandTop || vs.bandBottom || vs.bandLeft || vs.bandRight) {
      ctx.save();
      ctx.globalAlpha = Number(vs.bandOpacity ?? 95) / 100;
      const bFill = vs.bandColor || d.frameColor || '#0a0c13';
      const bAcc = vs.bandAccent || vs.accentColor || d.accent || '#facc15';
      const drawEdgeBand = (x, y, w, h, strokeColor) => {
        ctx.fillStyle = vs.bandStyle === 'gradient-glow'
          ? (() => { const g = ctx.createLinearGradient(x, y, x + w, y + h); g.addColorStop(0, vs.p1Color || d.p1); g.addColorStop(0.5, bAcc); g.addColorStop(1, vs.p2Color || d.p2); return g; })()
          : bFill;
        ctx.fillRect(x, y, w, h);
        ctx.fillStyle = strokeColor;
        if (w > h) ctx.fillRect(x, y === 0 ? h - 3 : y, w, 3);
        else ctx.fillRect(x === 0 ? w - 3 : x, y, 3, h);
      };
      if (vs.bandTop) drawEdgeBand(0, 0, 1920, bt, bAcc);
      if (vs.bandBottom) drawEdgeBand(0, 1080 - bt, 1920, bt, bAcc);
      if (vs.bandLeft) drawEdgeBand(0, 0, bt, 1080, vs.bandDualSideColor !== false ? (vs.p1Color || d.p1) : bAcc);
      if (vs.bandRight) drawEdgeBand(1920 - bt, 0, bt, 1080, vs.bandDualSideColor !== false ? (vs.p2Color || d.p2) : bAcc);
      ctx.restore();
    }

    // Header
    const hdrY = Number(vs.headerOffsetY ?? 0);
    const hdrX = Number(vs.headerOffsetX ?? 0);
    const hdrCx = vs.headerAlign === 'left' ? (360 + hdrX) : (vs.headerAlign === 'right' ? (1560 + hdrX) : (960 + hdrX));
    if ((vs.headerStyle || d.header) !== 'none') {
      ctx.save();
      ctx.globalAlpha = Number(vs.headerOpacity ?? 100) / 100;
      ctx.fillStyle = vs.headerBgColor || pickHex(d.headerBg, '#0a0c13');
      ctx.beginPath();
      ctx.moveTo(hdrCx - 320, hdrY); ctx.lineTo(hdrCx + 320, hdrY); ctx.lineTo(hdrCx + 280, hdrY + 108); ctx.lineTo(hdrCx - 280, hdrY + 108); ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = vs.headerBorderColor || vs.accentColor || d.accent || '#fff'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(hdrCx - 280, hdrY + 108); ctx.lineTo(hdrCx + 280, hdrY + 108); ctx.stroke();
      ctx.textAlign = 'center';
      if (vs.showEyebrow !== false && vs.eyebrow) {
        ctx.fillStyle = vs.headerEyebrowColor || vs.accentColor || d.accent || '#facc15';
        ctx.font = `800 ${Math.round(22 * (Number(vs.headerFontSize ?? 100) / 100))}px "Barlow Condensed", sans-serif`;
        ctx.fillText(String(vs.eyebrow).toUpperCase(), hdrCx, hdrY + 34);
      }
      ctx.fillStyle = vs.headerTextColor || d.headerText || '#ffffff';
      ctx.font = `900 ${Math.round(42 * (Number(vs.headerFontSize ?? 100) / 100))}px ${cFont}`;
      const showFmt = st.showFormat !== false && vs.headerFormatPos !== 'hidden' && match.format;
      const roundTitle = showFmt
        ? (vs.headerFormatPos === 'left' ? `${match.format}  ·  ${(match.round || 'ROUND 1').toUpperCase()}` : `${(match.round || 'ROUND 1').toUpperCase()}  ·  ${match.format}`)
        : (match.round || 'ROUND 1').toUpperCase();
      ctx.fillText(roundTitle, hdrCx, hdrY + 84);
      ctx.restore();
    }

    // Center VS Emblem
    if ((vs.emblemStyle || d.emblem) !== 'none') {
      ctx.save();
      const ex = 960 + Number(vs.emblemOffsetX ?? 0);
      const ey = 508 + Number(vs.emblemOffsetY ?? 0);
      const sz = Math.round(112 * (Number(vs.emblemScale ?? 100) / 100));
      ctx.translate(ex, ey);
      ctx.rotate((Number(vs.emblemRotate ?? 0) * Math.PI) / 180);
      ctx.font = `italic 900 ${sz}px ${cFont}`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 14; ctx.strokeStyle = vs.emblemStrokeColor || '#090b10';
      const txt = (vs.emblemText && vs.emblemText.trim()) ? vs.emblemText.trim() : 'VS';
      ctx.strokeText(txt, 0, 0);
      ctx.fillStyle = vs.emblemTextColor || '#ffffff';
      ctx.fillText(txt, 0, 0);
      ctx.restore();
    }

    // Plates with Custom Colors, Edge X, Flag-BG Print & Region-Only / Country / Both support!
    const pBot = (typeof vs.plateBottom === 'number' && vs.plateBottom >= 0) ? vs.plateBottom : (d.plateBottom ?? 168);
    const pEdgeX = (typeof vs.plateEdgeX === 'number' && vs.plateEdgeX >= 0) ? vs.plateEdgeX : 62;
    const pW = Number(vs.plateWidth ?? 790);
    const drawPlate = async (side, player, avIm, isHero) => {
      if (vs.plateStyle === 'none') return;
      const isLeft = side === 'p1';
      const h = Number(vs.plateMinHeight) > 0 ? Number(vs.plateMinHeight) : 142;
      const x = isLeft ? pEdgeX : (1920 - pEdgeX - pW);
      const y = 1080 - pBot - h;
      ctx.save();
      ctx.globalAlpha = Number(vs.plateOpacity ?? 96) / 100;
      const pBg1 = vs.plateBgColor || (d.lightBg && d.plateText === '#0f172a' ? 'rgba(255,255,255,0.95)' : 'rgba(8, 10, 16, 0.95)');
      if (vs.plateSurface === 'gradient' && vs.plateBgColor2) {
        const g = ctx.createLinearGradient(x, y, x + pW, y + h);
        g.addColorStop(0, pBg1); g.addColorStop(1, vs.plateBgColor2);
        ctx.fillStyle = g;
      } else {
        ctx.fillStyle = pBg1;
      }
      ctx.shadowColor = `rgba(0,0,0,${(Number(vs.plateShadow ?? 65) / 100).toFixed(2)})`; ctx.shadowBlur = 30;
      const rad = (typeof vs.plateRadius === 'number' && vs.plateRadius >= 0) ? vs.plateRadius : 8;
      ctx.beginPath(); ctx.roundRect(x, y, pW, h, rad); ctx.fill();
      ctx.shadowBlur = 0;

      // Optional Plate Flag Background print inside rounded plate clip
      if (vs.plateFlagBg && vs.plateFlagBg !== 'off') {
        const bgFlags = resolvePlateBgFlags(player, vs);
        if (bgFlags[0]) {
          const bgIm = await loadSvgAsImg(bgFlags[0].svg);
          if (bgIm) {
            ctx.save();
            ctx.beginPath(); ctx.roundRect(x, y, pW, h, rad); ctx.clip();
            ctx.globalAlpha = (Number(vs.plateFlagBgOpacity ?? 45) / 100) * (Number(vs.plateOpacity ?? 96) / 100);
            ctx.drawImage(bgIm, x, y, pW, h);
            const fadeG = ctx.createLinearGradient(isLeft ? x : x + pW, y, isLeft ? x + pW : x, y);
            fadeG.addColorStop(0, 'rgba(0,0,0,0)');
            fadeG.addColorStop(1, pBg1);
            ctx.globalAlpha = 0.85;
            ctx.fillStyle = fadeG;
            ctx.fillRect(x, y, pW, h);
            ctx.restore();
          }
        }
      }

      ctx.fillStyle = vs.plateBorderColor || (isLeft ? (vs.bgMode === 'custom' ? (vs.p1Color || d.p1) : d.p1) : (vs.bgMode === 'custom' ? (vs.p2Color || d.p2) : d.p2));
      ctx.fillRect(isLeft ? x : x + pW - 10, y, 10, h);

      const showBadge = Boolean(avIm && !isHero && avMode !== 'off');
      let textX = isLeft ? x + 32 : x + pW - 32;
      if (showBadge) {
        const bx = isLeft ? x + 28 : x + pW - 126, by = y + 22;
        ctx.save(); ctx.beginPath(); ctx.roundRect(bx, by, 98, 98, 12); ctx.clip();
        const s = Math.max(98 / avIm.naturalWidth, 98 / avIm.naturalHeight);
        ctx.drawImage(avIm, bx + 49 - (avIm.naturalWidth * s) / 2, by + 49 - (avIm.naturalHeight * s) / 2, avIm.naturalWidth * s, avIm.naturalHeight * s);
        ctx.restore();
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.roundRect(bx, by, 98, 98, 12); ctx.stroke();
        textX = isLeft ? x + 146 : x + pW - 146;
      }

      const flagItems = vs.plateFlagPos === 'bg-only' ? [] : resolvePlayerFlags(player, vs);
      let metaOffset = 0;
      for (const fi of flagItems) {
        const flagIm = await loadSvgAsImg(fi.svg);
        if (flagIm) {
          const fx = isLeft ? textX + metaOffset : textX - metaOffset - 44;
          ctx.drawImage(flagIm, fx, y + 18, 44, 29);
          metaOffset += 52;
        }
      }

      ctx.textAlign = isLeft ? 'left' : 'right';
      const metaLabel = [vs.showSponsor !== false ? player.sponsor : '', (vs.showBracket !== false && player.bracket) ? `[${player.bracket}]` : ''].filter(Boolean).join('  ');
      if (metaLabel) {
        ctx.fillStyle = vs.plateSponsorColor || vs.accentColor || d.accent || '#facc15';
        ctx.font = `800 ${Math.round(26 * (Number(vs.sponsorScale ?? 100) / 100))}px "Barlow Condensed", sans-serif`;
        ctx.fillText(metaLabel.toUpperCase(), isLeft ? textX + metaOffset : textX - metaOffset, y + 41);
      }
      ctx.fillStyle = vs.plateTextColor || d.plateText || '#ffffff';
      ctx.font = `900 ${Math.round(58 * (Number(vs.nameScale ?? 100) / 100))}px ${cFont}`;
      ctx.fillText((player.name || (isLeft ? 'PLAYER 1' : 'PLAYER 2')).slice(0, 22), textX, y + 98);
      if (vs.showCharName !== false && player.character) {
        ctx.fillStyle = vs.plateTextColor || (d.plateText === '#0f172a' ? 'rgba(15,23,42,0.72)' : 'rgba(255,255,255,0.75)');
        ctx.font = `800 ${Math.round(23 * (Number(vs.charNameScale ?? 100) / 100))}px "Barlow Condensed", sans-serif`;
        ctx.fillText(String(player.character).toUpperCase(), textX, y + 128);
      }
      ctx.restore();
    };
    await drawPlate('p1', p1, p1AvIm, p1Hero);
    await drawPlate('p2', p2, p2AvIm, p2Hero);

    if (logoIm) {
      const scale = Math.min(220 / logoIm.naturalWidth, 96 / logoIm.naturalHeight, 1) * (Number(vs.logoScale ?? 100) / 100);
      const lw = logoIm.naturalWidth * scale, lh = logoIm.naturalHeight * scale;
      const pos = vs.logoPos || 'bottom-left';
      const lx = pos === 'bottom-center' ? (960 - lw / 2) : (pos.endsWith('right') ? (1920 - 44 - lw) : 44);
      const ly = pos.startsWith('top') ? 24 : (pos === 'bottom-right' ? (1024 - lh) : (1054 - lh));
      ctx.drawImage(logoIm, lx, ly, lw, lh);
    }

    const a = document.createElement('a');
    const safeName = `${(p1.name || 'p1')}-vs-${(p2.name || 'p2')}`.toLowerCase().replace(/[^a-z0-9-]+/g, '-');
    a.download = `vs-splash-${safeName}.png`;
    a.href = canvas.toDataURL('image/png');
    a.click();
  }

  /* =========================================================================
     SYNC ENGINE: SSE + BroadcastChannel + Panel postMessage + OBS Scene Hooks
     ========================================================================= */
  window.addEventListener('message', (ev) => {
    const d = ev.data;
    if (!d) return;
    if (d.type === 'state-update' && d.state) {
      if (window.__isMuInteracting?.()) { currentState = d.state; return; }
      rescalePreview();
      render(d.state);
    }
    else if (d.type === 'fonts-update' && Array.isArray(d.fonts)) {
      window.FGC_CUSTOM_FONTS?.setFonts(d.fonts);
      if (currentState) render(currentState);
    }
    else if (d.type === 'history-update' && Array.isArray(d.history)) { historyDb = d.history; if (currentState) render(currentState); }
    else if (d.type === 'test-vs-entry') triggerEntryAnim(currentState?.vs?.entryAnim || 'slam-split');
    else if (d.type === 'export-vs-png') exportPngGraphic();
    else if (d.type === 'vs-interactive-config' && isPreview) {
      interactiveEdit = Boolean(d.interactive);
      dragEnabled = Boolean(d.drag);
      document.body.classList.toggle('interactive-edit', interactiveEdit);
      if (!interactiveEdit) highlightSelectedEl('');
    } else if (d.type === 'vs-highlight-element' && isPreview) {
      highlightSelectedEl(d.element || '');
    } else if (d.type === 'vs-mu-highlight' && isPreview) {
      window.__highlightMuHalf?.(d.key || '');
    }
  });

  const onSceneShow = () => {
    if (currentState?.vs?.visible !== false) triggerEntryAnim(currentState?.vs?.entryAnim || 'slam-split');
  };
  window.addEventListener('obsSourceActiveChanged', (e) => { if (e?.detail?.active) onSceneShow(); });
  window.addEventListener('obsSourceVisibleChanged', (e) => { if (e?.detail?.visible) onSceneShow(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) onSceneShow(); });

  window.FGC_AUDIO?.init({ role: 'vs', isPreview: isPreview || isExport });

  let bc = null;
  try {
    bc = new BroadcastChannel('fgc_open_scorebar');
    bc.onmessage = (ev) => {
      if (ev.data?.type === 'state' && ev.data.payload) render(ev.data.payload);
      else if (ev.data?.type === 'fonts' && Array.isArray(ev.data.payload)) {
        window.FGC_CUSTOM_FONTS?.setFonts(ev.data.payload);
        if (currentState) render(currentState);
      } else if (ev.data?.type === 'sfx' && Array.isArray(ev.data.payload)) {
        window.FGC_AUDIO?.setCustomSfx(ev.data.payload);
      } else if (ev.data?.type === 'audio' && ev.data.payload) {
        window.FGC_AUDIO?.handleAudioEvent(ev.data.payload);
      }
    };
  } catch {}

  // NOTE: Preview iframes inside panel.html NEVER open EventSource (prevents Chrome 6-socket HTTP/1.1 deadlock).
  if (isHttp) {
    window.FGC_CUSTOM_FONTS?.fetchAndSync().then(() => { if (currentState) render(currentState); });
    fetch('/api/history', { cache: 'no-store' }).then(r => r.json()).then(list => { historyDb = list; if (currentState) render(currentState); }).catch(() => {});
    fetch('/api/state', { cache: 'no-store' }).then(r => r.json()).then(st => {
      render(st);
      if (!isPreview && !isExport && st?.vs?.visible !== false) triggerEntryAnim(st?.vs?.entryAnim || 'slam-split');
    }).catch(() => {
      $('vs-stage')?.classList.remove('is-booting');
    });

    if (!isPreview && !isExport) {
      let activeEs = null;
      let reconnectTimer = null;
      let pageUnloading = false;
      const closeSSE = () => {
        pageUnloading = true;
        clearTimeout(reconnectTimer);
        if (activeEs) { try { activeEs.close(); } catch {} activeEs = null; }
      };
      window.addEventListener('pagehide', closeSSE);
      window.addEventListener('beforeunload', closeSSE);

      const connectSSE = () => {
        if (pageUnloading) return;
        if (activeEs) { try { activeEs.close(); } catch {} }
        const es = new EventSource('/api/events?client=vs' + (window.obsstudio ? '&obs=1' : ''));
        activeEs = es;
        es.addEventListener('state', (ev) => {
          try {
            const data = JSON.parse(ev.data);
            render(data);
            if (bc) bc.postMessage({ type: 'state', payload: data, fromSse: true });
          } catch {}
        });
        es.addEventListener('fonts', (ev) => {
          try {
            const list = JSON.parse(ev.data);
            window.FGC_CUSTOM_FONTS?.setFonts(list);
            if (currentState) render(currentState);
            if (bc) bc.postMessage({ type: 'fonts', payload: list, fromSse: true });
          } catch {}
        });
        es.addEventListener('sfx', (ev) => {
          try {
            const list = JSON.parse(ev.data);
            window.FGC_AUDIO?.setCustomSfx(list);
            if (bc) bc.postMessage({ type: 'sfx', payload: list, fromSse: true });
          } catch {}
        });
        es.addEventListener('audio', (ev) => {
          try {
            const payload = JSON.parse(ev.data);
            window.FGC_AUDIO?.handleAudioEvent(payload);
            if (bc) bc.postMessage({ type: 'audio', payload, fromSse: true });
          } catch {}
        });
        es.onerror = () => {
          if (activeEs === es) activeEs = null;
          try { es.close(); } catch {}
          clearTimeout(reconnectTimer);
          if (!pageUnloading) reconnectTimer = setTimeout(connectSSE, 1500);
        };
      };

      const isObs = Boolean(window.obsstudio);
      if (!isObs && navigator.locks && typeof navigator.locks.request === 'function' && bc) {
        navigator.locks.request('fgc_open_scorebar_sse_leader', () => new Promise((resolve) => {
          if (pageUnloading) return resolve();
          connectSSE();
          window.addEventListener('pagehide', resolve, { once: true });
          window.addEventListener('beforeunload', resolve, { once: true });
        })).catch(() => connectSSE());
      } else {
        connectSSE();
      }
    }
  } else {
    try {
      const cached = localStorage.getItem('fgc_open_scorebar_state_v1');
      if (cached) render(JSON.parse(cached));
      else $('vs-stage')?.classList.remove('is-booting');
    } catch { $('vs-stage')?.classList.remove('is-booting'); }
  }
})();
</script>
</body>
</html>
