<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="1200" height="290" role="img" aria-label="FGC Open Scorebars — Broadcast-Grade Overlays Built Open for the FGC">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111625"/>
      <stop offset="52%" stop-color="#0a0d16"/>
      <stop offset="100%" stop-color="#0d1120"/>
    </linearGradient>
    <linearGradient id="borderLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b1a" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#fde68a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="18%" cy="50%" r="34%">
      <stop offset="0%" stop-color="#ff5a1f" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0a0d16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="84%" cy="50%" r="38%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#0a0d16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentRule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b1a"/>
      <stop offset="48%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Clash Bars Emblem Gradients -->
    <linearGradient id="p1Main" x1="12%" y1="10%" x2="90%" y2="95%">
      <stop offset="0%" stop-color="#ff8a1e"/>
      <stop offset="46%" stop-color="#ff491f"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="p1FacetTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9f2e"/>
      <stop offset="58%" stop-color="#ff5b1f"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="p1Fin" x1="15%" y1="0%" x2="88%" y2="100%">
      <stop offset="0%" stop-color="#ff4d24"/>
      <stop offset="55%" stop-color="#ec1d4a"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="p2Main" x1="88%" y1="10%" x2="10%" y2="95%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="48%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="p2FacetTop" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="56%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="p2Fin" x1="85%" y1="0%" x2="12%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="55%" stop-color="#3b5bfd"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="bracketGold" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="52%" stop-color="#fef0b2"/>
      <stop offset="100%" stop-color="#f5c063"/>
    </linearGradient>
    <linearGradient id="sparkOuter" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f5c063"/>
      <stop offset="30%" stop-color="#fff8dc"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#fff8dc"/>
      <stop offset="100%" stop-color="#f5c063"/>
    </linearGradient>
    <linearGradient id="openWordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff8a24"/>
      <stop offset="52%" stop-color="#ffd966"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="sparkGlow" x="-40%" y="-25%" width="180%" height="150%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Banner Frame -->
  <rect x="2" y="2" width="1196" height="286" rx="22" fill="url(#bannerBg)" stroke="url(#borderLine)" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="286" rx="22" fill="url(#glowLeft)"/>
  <rect x="2" y="2" width="1196" height="286" rx="22" fill="url(#glowRight)"/>

  <!-- Subtle Broadcast Corner Brackets & Diagonal Telemetry Accents -->
  <path d="M 28 54 L 28 28 L 54 28" fill="none" stroke="#ff6b1a" stroke-width="2.5" stroke-opacity="0.65"/>
  <path d="M 1172 236 L 1172 262 L 1146 262" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-opacity="0.65"/>
  <polygon points="1030,2 1068,2 1018,288 980,288" fill="#ffffff" fill-opacity="0.02"/>
  <polygon points="1090,2 1110,2 1060,288 1040,288" fill="#ffffff" fill-opacity="0.015"/>

  <!-- Clash Bars Emblem (Scaled cleanly to left slot) -->
  <g transform="translate(52, 17) scale(0.495)">
    <polygon points="34,104 222,194 159,248 222,302 243,420 137,298 159,302 106,256 135,265 75,196 82,190" fill="url(#p1Main)"/>
    <polygon points="34,104 222,194 180,230 79,181" fill="url(#p1FacetTop)"/>
    <polygon points="106,256 159,248 222,302 243,420 137,298 159,302" fill="url(#p1Fin)"/>
    <polygon points="34,104 222,194 215,199 41,115" fill="#ffd89c" fill-opacity="0.45"/>

    <polygon points="478,104 290,194 353,248 290,302 269,420 375,298 353,302 406,256 377,265 437,196 430,190" fill="url(#p2Main)"/>
    <polygon points="478,104 290,194 332,230 433,181" fill="url(#p2FacetTop)"/>
    <polygon points="406,256 353,248 290,302 269,420 375,298 353,302" fill="url(#p2Fin)"/>
    <polygon points="478,104 290,194 297,199 471,115" fill="#d8b4fe" fill-opacity="0.45"/>

    <g filter="url(#sparkGlow)">
      <polygon points="236,204 236,225 212,248 236,271 236,292 189,248" fill="url(#bracketGold)"/>
      <polygon points="276,204 276,225 300,248 276,271 276,292 323,248" fill="url(#bracketGold)"/>
      <path d="M 256 144 C 258 197 265 229 276 248 C 265 267 258 299 256 352 C 254 299 247 267 236 248 C 247 229 254 197 256 144 Z" fill="url(#sparkOuter)"/>
      <polygon points="256,210 267,248 256,286 245,248" fill="#ffffff"/>
    </g>
  </g>

  <!-- Vertical Separator Slash -->
  <polygon points="348,66 354,66 336,224 330,224" fill="url(#accentRule)" fill-opacity="0.55"/>

  <!-- Brand Wordmark & Broadcast Tagline -->
  <g transform="translate(382, 0)">
    <!-- Eyebrow Pill -->
    <rect x="0" y="50" width="268" height="24" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1"/>
    <circle cx="16" cy="62" r="4" fill="#ff6b1a"/>
    <text x="29" y="66.5" font-family="'Segoe UI', 'Bahnschrift', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" letter-spacing="2.4" fill="#e2e8f0">100% FREE &amp; OPEN SOURCE</text>

    <!-- Primary Title -->
    <text x="0" y="148" font-family="'Bahnschrift', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="68" font-weight="900" letter-spacing="2.5" fill="#ffffff">FGC <tspan fill="url(#openWordGrad)">OPEN</tspan> SCOREBARS</text>

    <!-- Dual-Energy Accent Bar -->
    <rect x="0" y="166" width="736" height="3.5" rx="2" fill="url(#accentRule)"/>

    <!-- Powerful Tagline -->
    <text x="0" y="202" font-family="'Segoe UI', 'Bahnschrift', system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" letter-spacing="2.8" fill="#cbd5e1">BROADCAST-GRADE OVERLAYS · BUILT OPEN FOR THE FGC</text>

    <!-- Feature Chips -->
    <text x="0" y="236" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600" letter-spacing="1.2" fill="#94a3b8">SCOREBARS  ·  VS SPLASH  ·  TOP 8 RESULTS  ·  START.GG &amp; CHALLONGE  ·  OBS READY</text>
  </g>
</svg>
